<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>认证通道诊断</title>
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f7;margin:0;padding:24px 16px;color:#1d1d1f}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:20px;margin:0 0 6px}
  .sub{font-size:13px;color:#6e6e73;margin-bottom:20px;line-height:1.6}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  button{width:100%;padding:13px 16px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;background:var(--sx-accent);color:#fff;margin-bottom:8px}
  button:active{opacity:.85}
  .btn2{background:#e8e8ed;color:#1d1d1f}
  .btn3{background:#e8e8ed;color:#1d1d1f}
  .res{font-size:13px;line-height:1.7;margin-top:4px;white-space:pre-wrap;word-break:break-all}
  .ok{color:#15803d;font-weight:700}
  .bad{color:#dc2626;font-weight:700}
  .warn{color:#b45309;font-weight:700}
  .hint{font-size:12px;color:#86868b;line-height:1.7;margin-top:10px;border-top:1px solid #eee;padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>认证通道诊断</h1>
  <div class="sub">用于排查小程序填报故障。点按钮即向 Supabase 发一次真实请求，结果显示在按钮下方。测试全程不使用、不接触任何真实账号密码。</div>

  <div class="card">
    <button onclick="testAnon()">① 测试匿名登录（填报命脉）</button>
    <div class="res" id="r1"></div>
  </div>

  <div class="card">
    <button class="btn2" onclick="testSignup()">② 测试自助注册（安全口子）</button>
    <div class="res" id="r2"></div>
  </div>

  <div class="card">
    <button class="btn3" onclick="testLogin()">③ 测试登录通道（7人后台）</button>
    <div class="res" id="r3"></div>
  </div>

  <div class="card">
    <div class="hint" id="clock"></div>
    <div class="hint">说明：①② 测试成功时会在服务器各留一个测试账号（无法从网页端删除，之后统一清理）；③ 永远成功不了才是正常的（用的是假密码）。测试时间会显示在上方。</div>
  </div>
</div>

<script>
var REF = 'fgrjdaizgjpqdimgtxrp';
var KEY = 'sb_publishable_PddH-hdBtn_G2vwtdB9xuA_UuBSLVgG';
var BASE = 'https://' + REF + '.supabase.co/auth/v1';

function show(id, cls, text){ var el = document.getElementById(id); el.innerHTML = '<span class="' + cls + '">' + text + '</span>'; }
function now(){ return new Date().toLocaleTimeString('zh-CN'); }
function stamp(){ document.getElementById('clock').textContent = '最近测试：' + now(); }

function post(url, body){
  return fetch(url, {
    method: 'POST',
    headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(function(r){
    return r.text().then(function(t){ return { status: r.status, body: t }; });
  }).catch(function(e){
    return { status: -1, body: '网络错误: ' + e.message };
  });
}

function testAnon(){
  show('r1', 'warn', '测试中…');
  post(BASE + '/signup', { is_anonymous: true }).then(function(r){
    stamp();
    if (r.status === 200){
      show('r1', 'ok', 'HTTP 200 → 匿名登录是【开】的 ✓\n填报通道正常。');
    } else if (r.status === 422 && r.body.indexOf('anonymous') >= 0){
      show('r1', 'bad', 'HTTP 422 → 匿名登录是【关】的 ✗\n填报必然失败！去 Dashboard 把 Allow anonymous sign-ins 打开并点 Save changes。');
    } else if (r.body.indexOf('not allowed') >= 0 || r.body.indexOf('signup') >= 0){
      show('r1', 'bad', 'HTTP ' + r.status + ' → 被注册开关拦截：' + r.body + '\n说明匿名登录确实受 Allow new users to sign up 影响（两开关联动）。');
    } else {
      show('r1', 'warn', 'HTTP ' + r.status + ' → ' + r.body);
    }
  });
}

function testSignup(){
  show('r2', 'warn', '测试中…');
  var mail = 'probe_ui_' + Date.now() + '@gmail.com';
  post(BASE + '/signup', { email: mail, password: 'Xk9#mP2$vLq8zR' }).then(function(r){
    stamp();
    if (r.status === 200){
      show('r2', 'warn', 'HTTP 200 → 自助注册是【开】的 ⚠️\n外人可以自己注册账号，建议到 Dashboard 关掉（前提是先确认①不受影响）。');
    } else if (r.body.indexOf('not allowed') >= 0){
      show('r2', 'ok', 'HTTP 400 → 自助注册是【关】的 ✓\n安全口子已堵上。');
    } else {
      show('r2', 'warn', 'HTTP ' + r.status + ' → ' + r.body);
    }
  });
}

function testLogin(){
  show('r3', 'warn', '测试中…');
  post(BASE + '/token?grant_type=password', { email: 'fake_probe@test.com', password: 'wrong-password-123' }).then(function(r){
    stamp();
    if (r.status === 400 && r.body.indexOf('invalid') >= 0){
      show('r3', 'ok', 'HTTP 400 假凭据被正确拒绝 → 登录通道正常 ✓\n（假密码当然登不进，通道活着才是重点）');
    } else if (r.body.indexOf('Email logins are disabled') >= 0 || r.body.indexOf('provider') >= 0){
      show('r3', 'bad', 'HTTP ' + r.status + ' → 登录通道被封 ✗ ' + r.body + '\n去把 Email provider 开关打开！');
    } else {
      show('r3', 'warn', 'HTTP ' + r.status + ' → ' + r.body);
    }
  });
}
</script>
</body>
</html>
