<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>書荀后台 · 域名反代验收</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 28px 18px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #F5FAFF; color: #14213D; line-height: 1.6;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { font-size: 13px; color: #6B7A99; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #DBEAFB; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; color: #14213D; }
  label { font-size: 13px; color: #4A5A78; display: block; margin-bottom: 5px; }
  input[type=text], input[type=password], input[type=email] {
    width: 100%; padding: 11px 12px; font-size: 15px; border: 1px solid #DBEAFB;
    border-radius: 10px; background: #F5FAFF; color: #14213D; outline: none;
  }
  input:focus { border-color: #007AFF; background: #fff; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1 1 200px; }
  button {
    padding: 11px 20px; font-size: 15px; border-radius: 10px; border: 0; cursor: pointer;
    background: #007AFF; color: #fff; font-weight: 600;
  }
  button:active { transform: scale(.97); }
  button.ghost { background: #E6F4FF; color: #007AFF; }
  button:disabled { opacity: .5; cursor: default; }
  .btns { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid #DBEAFB; vertical-align: top; }
  th { font-size: 12px; color: #6B7A99; background: #E6F4FF; font-weight: 600; }
  td.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; word-break: break-all; }
  .pass { color: #10B981; font-weight: 700; }
  .fail { color: #F04438; font-weight: 700; }
  .skip { color: #F59E0B; font-weight: 700; }
  .run  { color: #6B7A99; }
  .hint { font-size: 12px; color: #6B7A99; margin-top: 8px; }
  .kv { font-size: 12px; color: #6B7A99; }
  pre {
    margin: 0; background: #F5FAFF; border: 1px solid #DBEAFB; border-radius: 8px;
    padding: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; background:#E6F4FF; color:#007AFF; }
</style>
</head>
<body>
<div class="wrap">
  <h1>書荀后台 · 域名反代验收</h1>
  <div class="sub">验证自有域名反代是否同时满足：登录可用、分页不截断、Prefer 头透传、CORS 放行。</div>

  <div class="card">
    <h2>检测参数</h2>
    <div class="row">
      <div>
        <label>反代域名（新地址）</label>
        <input type="text" id="host" placeholder="api.你的域名" />
      </div>
      <div>
        <label>后台邮箱（选填，用于真登录与分页测试）</label>
        <input type="email" id="email" placeholder="411249585@qq.com" autocomplete="username" />
      </div>
      <div>
        <label>密码（选填）</label>
        <input type="password" id="pwd" placeholder="登录密码" autocomplete="current-password" />
      </div>
    </div>
    <div class="btns">
      <button id="go">开始检测</button>
      <button class="ghost" id="cmp">顺便对比旧域名</button>
      <button class="ghost" id="copy">复制报告</button>
    </div>
    <div class="hint">不填账号也能跑前 3 项（连通 / CORS / 登录端点）；要验「分页不截断」必须填账号密码真登录一次。</div>
  </div>

  <div class="card">
    <h2>检测结果</h2>
    <table>
      <thead><tr><th style="width:32px">#</th><th style="width:130px">项目</th><th style="width:70px">结果</th><th>实测</th></tr></thead>
      <tbody id="tb"><tr><td colspan="4" class="kv">点「开始检测」后逐项跑…</td></tr></tbody>
    </table>
    <div class="hint" id="env" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>原始报文（出错时看这里）</h2>
    <pre id="raw">—</pre>
  </div>
</div>

<script>
var KEY = 'sb_publishable_PddH-hdBtn_G2vwtdB9xuA_UuBSLVgG';
var OLD = 'https://fgrjdaizgjpqdimgtxrp.supabase.co';
var NEW = '';
var TOKEN = '';
var rows = [];
var rawLines = [];

function h(host){ return 'https://' + String(host||'').replace(/^https?:\/\//,'').replace(/\/+$/,''); }
function $(id){ return document.getElementById(id); }
function log(s){ rawLines.push(s); $('raw').textContent = rawLines.join('\n'); }

function render(){
  var tb = $('tb');
  if(!rows.length){ tb.innerHTML = '<tr><td colspan="4" class="kv">点「开始检测」后逐项跑…</td></tr>'; return; }
  tb.innerHTML = rows.map(function(r,i){
    var cls = r.s==='通过' ? 'pass' : (r.s==='失败' ? 'fail' : (r.s==='跳过' ? 'skip' : 'run'));
    return '<tr><td class="kv">'+(i+1)+'</td><td>'+r.n+'<div class="kv">'+r.w+'</div></td>'+
           '<td class="'+cls+'">'+r.s+'</td><td class="mono">'+r.d+'</td></tr>';
  }).join('');
}
function add(n,w,s,d){ rows.push({n:n,w:w,s:s,d:d}); render(); }
function set(i,s,d){ rows[i].s=s; rows[i].d=d; render(); }

// 带超时与网络错误归类的请求
function req(url, opt, ms){
  opt = opt || {}; opt.cache = 'no-store';
  var ctl = new AbortController(); opt.signal = ctl.signal;
  var t = setTimeout(function(){ ctl.abort(); }, ms || 15000);
  return fetch(url, opt).then(function(r){
    clearTimeout(t); return r;
  }).catch(function(e){
    clearTimeout(t);
    e.__net = true; throw e;
  });
}

/* ① 连通性：/auth/v1/health */
async function tConnect(host){
  var i = rows.length; add('连通性','GET /auth/v1/health','…','');
  log('→ GET ' + h(host) + '/auth/v1/health');
  try{
    var r = await req(h(host)+'/auth/v1/health', {headers:{apikey:KEY}}, 12000);
    var b = await r.text();
    log('← HTTP ' + r.status + '  ' + b.slice(0,200));
    set(i, r.status===200?'通过':'失败', 'HTTP '+r.status+' · '+(b.slice(0,80)||'空响应'));
  }catch(e){
    set(i,'失败','网络层失败（Load failed / Failed to fetch）—— 域名没连上');
    log('← 网络层失败：' + e.message);
  }
}

/* ② CORS 预检：带 apikey/prefer/range/x-client-info 的真实请求能否成功
   说明：浏览器 JS 读不到 Access-Control-Allow-Headers，所以用「带这些头能拿到 HTTP 状态」来反推预检被放行 */
async function tCors(host){
  var i = rows.length; add('CORS 预检','带 apikey/prefer/range/x-client-info 发请求','…','');
  try{
    var r = await req(h(host)+'/rest/v1/stores?select=id', {headers:{
      apikey:KEY, Authorization:'Bearer '+KEY,
      Prefer:'count=exact', Range:'0-0', 'X-Client-Info':'proxy-check'
    }}, 12000);
    var b = await r.text();
    log('← HTTP ' + r.status + '  ' + b.slice(0,120));
    var ok = r.status < 500;
    set(i, ok?'通过':'失败', 'HTTP '+r.status+'（能拿到状态码 = 预检已放行；否则会是网络层失败）');
  }catch(e){
    set(i,'失败','预检被拦 → '+e.message+'（Worker 的 Access-Control-Allow-Headers 没放行）');
    log('← 预检失败：'+e.message);
  }
}

/* ③ 登录端点可达：假账号应为 400 invalid_credentials，连不上才会是网络失败 */
async function tLoginEndpoint(host){
  var i = rows.length; add('登录端点','POST /auth/v1/token（假账号）','…','');
  try{
    var r = await req(h(host)+'/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{apikey:KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({email:'__not_exist__@shuxun.invalid', password:'wrong-password-123'})
    }, 12000);
    var b = await r.text();
    log('← HTTP ' + r.status + '  ' + b.slice(0,200));
    var good = (r.status===400) && /invalid|credential|login/i.test(b);
    set(i, good?'通过':'失败', 'HTTP '+r.status+' · '+(b.slice(0,110)||'空响应')+'　（期望 400 invalid_credentials，说明 auth 端点转发正常）');
  }catch(e){
    set(i,'失败','网络层失败 → '+e.message);
    log('← 网络层失败：'+e.message);
  }
}

/* ④ 真登录 */
async function tRealLogin(host){
  var i = rows.length; add('真登录','用你的账号拿 access_token','…','');
  try{
    var r = await req(h(host)+'/auth/v1/token?grant_type=password', {
      method:'POST',
      headers:{apikey:KEY, 'Content-Type':'application/json'},
      body: JSON.stringify({email:$('email').value.trim(), password:$('pwd').value})
    }, 15000);
    var b = await r.text();
    var j = {}; try{ j = JSON.parse(b); }catch(e){}
    log('← HTTP ' + r.status + '  ' + b.slice(0,120));
    if(j.access_token){ TOKEN = j.access_token; set(i,'通过','HTTP '+r.status+' · 拿到 token（'+j.access_token.length+' 字符）'); }
    else set(i,'失败','HTTP '+r.status+' · '+(j.error_description||j.msg||b.slice(0,120)));
  }catch(e){ set(i,'失败','网络层失败 → '+e.message); }
}

/* ⑤ Prefer 透传：count=exact 必须给出具体总数，而不是 * */
async function tPrefer(host){
  var i = rows.length; add('Prefer 透传','count=exact 是否给出真实总数','…','');
  try{
    var r = await req(h(host)+'/rest/v1/stores?select=id', {headers:{
      apikey:KEY, Authorization:'Bearer '+TOKEN, Prefer:'count=exact', Range:'0-0'
    }}, 15000);
    var cr = r.headers.get('content-range') || r.headers.get('Content-Range') || '';
    await r.text();
    log('← HTTP ' + r.status + '  content-range: ' + cr);
    var exact = cr && cr.indexOf('*') < 0;
    set(i, exact?'通过':'失败', 'content-range = '+(cr||'(无)')+'　（含具体总数 = Prefer 已透传；出现 * 说明头被丢了）');
  }catch(e){ set(i,'失败','网络层失败 → '+e.message); }
}

/* ⑥ Range 分页：取第 2 页（1000~1999），验证没有只回前 1000 行 */
async function tRange(host){
  var i = rows.length; add('Range 分页','chain_verify_orders 取第 2 页(1000-1999)','…','');
  var base = h(host)+'/rest/v1/chain_verify_orders?select=order_no,done_time,amount';
  try{
    var r1 = await req(base, {headers:{apikey:KEY, Authorization:'Bearer '+TOKEN, Range:'0-999'}}, 20000);
    var j1 = await r1.json();
    var cr1 = r1.headers.get('content-range')||'';
    var r2 = await req(base, {headers:{apikey:KEY, Authorization:'Bearer '+TOKEN, Range:'1000-1999'}}, 20000);
    var j2 = await r2.json();
    var cr2 = r2.headers.get('content-range')||'';
    log('← 第1段 HTTP '+r1.status+'  '+cr1+'  行数 '+j1.length);
    log('← 第2段 HTTP '+r2.status+'  '+cr2+'  行数 '+j2.length);
    var total = parseInt((cr2.split('/')[1]||'0'),10);
    var ok = r2.status===206 && j2.length===1000 && total>1000 && j1[0] && j2[0] && j1[0].order_no!==j2[0].order_no;
    set(i, ok?'通过':'失败',
      '第1段 '+j1.length+' 行 / 第2段 '+j2.length+' 行 · content-range '+cr2+' · 总行数 '+total+
      '　（第2段必须恰好 1000 行且与第1段不重复）');
  }catch(e){ set(i,'失败','网络层失败或解析失败 → '+e.message); }
}

/* ⑦ 端到端分页：把「昨天」的全部核销单分页取完，看行数与金额合计
   （单看第 2 段只能证明 Range 生效；完整循环才能真正证明「不会只出前 1000 行」） */
function ymd(off){
  var d = new Date(Date.now() + off*86400000);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
async function tLoop(host){
  var i = rows.length; add('端到端分页','昨日核销单全部取完（1000/页循环）','…','');
  var url = h(host) + '/rest/v1/chain_verify_orders?select=order_no,done_time,amount' +
            '&done_time=gte.' + ymd(-1) + '&done_time=lt.' + ymd(0) + '&order=done_time.asc';
  var all = [], pages = 0, total = 0;
  try{
    for(var p=0; p<40; p++){
      var r = await req(url, {headers:{apikey:KEY, Authorization:'Bearer '+TOKEN,
              Range:(p*1000)+'-'+(p*1000+999)}}, 25000);
      if(p===0){
        var cr = r.headers.get('content-range')||'';
        total = parseInt((cr.split('/')[1]||'0'), 10);
        log('← content-range: ' + cr);
      }
      var j = await r.json();
      if(!Array.isArray(j)) throw new Error('返回不是数组：' + JSON.stringify(j).slice(0,120));
      all = all.concat(j); pages++;
      if(j.length < 1000) break;
    }
    var sum = all.reduce(function(a,b){ return a + (Number(b.amount)||0); }, 0);
    log('← 取完：' + pages + ' 页 / ' + all.length + ' 行 / 合计 ' + sum.toFixed(2));
    var ok = all.length === total && all.length > 0;
    set(i, ok?'通过':'失败',
      '声明总数 '+total+' · 实取 '+all.length+' 行 · '+pages+' 页 · 金额合计 ¥'+sum.toFixed(2)+
      '　（实取 = 声明总数 才算真的没被截断）');
  }catch(e){ set(i,'失败','分页中断 → '+e.message); log('← 分页失败：'+e.message); }
}

async function runAll(host, tag){
  var mark = rows.length;
  await tConnect(host);
  await tCors(host);
  await tLoginEndpoint(host);
  if($('email').value.trim() && $('pwd').value){
    await tRealLogin(host);
    if(TOKEN){ await tPrefer(host); await tRange(host); await tLoop(host); }
    else { add('登录后的三项','需先拿到 token','跳过','真登录没成功，后续跳过'); }
  }else{
    add('真登录 / 分页 / 一致性','需要账号密码','跳过','未填账号密码，这三项跳过');
  }
  for(var k=mark;k<rows.length;k++) rows[k].n = tag + rows[k].n;
  render();
}

$('go').onclick = async function(){
  var host = $('host').value.trim();
  if(!host){ alert('先填反代域名，例如 api.你的域名'); return; }
  try{ localStorage.setItem('sx_proxy_host', host); }catch(e){}
  NEW = h(host);
  rows = []; rawLines = []; render(); log('=== 检测 ' + NEW + ' ===');
  $('go').disabled = true; $('cmp').disabled = true;
  try{ await runAll(NEW, ''); }
  finally{ $('go').disabled = false; $('cmp').disabled = false; }
  var bad = rows.filter(function(r){ return r.s==='失败'; }).length;
  $('env').innerHTML = '<span class="badge">汇总</span> 共 '+rows.length+' 项，失败 '+bad+' 项。'+
    (bad? ' 把上面「复制报告」的结果发我。' : ' 全绿 —— 可以切页面常量了。');
};

$('cmp').onclick = async function(){
  rows = []; rawLines = []; render();
  $('go').disabled = true; $('cmp').disabled = true;
  log('=== 新域名 ===');
  await runAll(h($('host').value.trim()) || NEW, '【新】');
  TOKEN = '';
  log('\n=== 旧域名（官方 supabase.co）===');
  await runAll(OLD, '【旧】');
  $('go').disabled = false; $('cmp').disabled = false;
};

$('copy').onclick = function(){
  var txt = '書荀后台 · 域名反代验收\n域名：' + ($('host').value.trim()||'(未填)') +
    '\n时间：' + new Date().toLocaleString('zh-CN') +
    '\n环境：' + navigator.userAgent + '\n\n' +
    rows.map(function(r,i){ return (i+1)+'. ['+r.s+'] '+r.n+' — '+r.d; }).join('\n') +
    '\n\n原始报文：\n' + $('raw').textContent;
  navigator.clipboard ? navigator.clipboard.writeText(txt).then(function(){ alert('已复制'); }) : alert(txt);
};

(function init(){
  var q = new URLSearchParams(location.search).get('host');
  var saved = ''; try{ saved = localStorage.getItem('sx_proxy_host')||''; }catch(e){}
  $('host').value = q || saved;
  $('env').innerHTML = '页面来源：' + location.origin + '　UA：' + navigator.userAgent.slice(0,90);
})();
</script>
</body>
</html>
