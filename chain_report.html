<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>书荀连锁 · 周运营诊断（自动生成）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:680px;margin:0 auto;padding:16px 14px 48px}
@media (min-width:1024px){.wrap{max-width:1200px;padding:16px 28px 56px}}
.hero{padding:14px 4px 6px}
.hero h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.hero .sub{color:#6e6e73;font-size:13px;margin-top:6px}
section{margin-top:26px}
h2{font-size:18px;font-weight:700;margin-bottom:10px;letter-spacing:-.2px}
.badge{font-size:11px;font-weight:600;color:#0a84ff;background:rgba(10,132,255,.1);border-radius:20px;padding:3px 10px;margin-left:8px;vertical-align:2px}
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border-radius:16px;padding:14px 16px}
.kpi-l{font-size:12px;color:#6e6e73}
.kpi-v{font-size:24px;font-weight:700;margin-top:2px;letter-spacing:-.4px}
.kpi-s{font-size:12px;margin-top:3px;color:#6e6e73}
.delta{font-weight:600}
.concl{background:#fff;border-radius:16px;padding:16px 18px}
.concl li{list-style:none;padding:7px 0 7px 22px;position:relative;font-size:14px;border-bottom:1px solid #f0f0f2}
.concl li:last-child{border-bottom:none}
.concl li:before{content:"";position:absolute;left:2px;top:14px;width:8px;height:8px;border-radius:50%;background:#0a84ff}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:13px}
th{font-size:11px;color:#6e6e73;font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid #ececee;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f2f2f4;white-space:nowrap}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;border-radius:6px;padding:2px 6px;margin-left:6px;font-weight:600;vertical-align:1px}
.chart{background:#fff;border-radius:16px;width:100%;height:auto}
.chart-mini{width:100%;max-width:720px;margin:10px auto 2px;height:auto}
.ax{font-size:.75rem;fill:#8a8a8e}
.axv{font-size:.75rem;fill:#6e6e73;font-weight:600}
.axl{font-size:.75rem;fill:#6e6e73}
.axw{font-size:.6875rem;fill:#fff;font-weight:600}
.axb{font-size:.6875rem;fill:#7a4d00;font-weight:600}
/* 本周（复盘周）X 轴标签高亮，一眼区分历史 7 周 */
.ax-cur{fill:#0a84ff;font-weight:700}
.stname{color:#0a84ff;cursor:pointer;border-bottom:1px dashed #0a84ff}
tr.drow td{background:#fafafc;white-space:normal}
.note{font-size:12px;color:#6e6e73;margin-top:8px}
.warnbox{background:#fff;border-radius:16px;padding:4px 16px;margin-top:10px}
.warn{padding:12px 0;border-bottom:1px solid #f0f0f2;font-size:13.5px}
.warn:last-child{border:none}
.warn .wt{font-weight:700}
.foot{margin-top:34px;font-size:11px;color:#98989d;line-height:1.7;border-top:1px solid #e5e5ea;padding-top:14px}
.empty{color:#8a8a8e;font-size:13px;background:#fff;border-radius:14px;padding:14px 16px}
.loadbox{text-align:center;padding:80px 20px;color:#6e6e73;font-size:14px}
.loadbox .spin{display:inline-block;width:26px;height:26px;border:3px solid #e5e5ea;border-top-color:#0a84ff;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{background:#fff5f5;border:1px solid #ffd6d6;color:#c0392b;border-radius:14px;padding:16px;font-size:13px;margin-top:30px}
.selrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.selrow select,.selrow button{font-size:12.5px;padding:7px 10px;border-radius:10px;border:1px solid #d8dbe3;background:#fff;color:#1d1d1f;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

  <div id="loading" class="loadbox"><span class="spin"></span><br>正在拉取订单与门店数据…</div>
  <div id="errbox" class="errbox hide" style="display:none"></div>
  <div id="app" style="display:none"></div>
</div>

<script>
const SB_URL = 'https://fgrjdaizgjpqdimgtxrp.supabase.co';
const SB_KEY = 'sb_publishable_PddH-hdBtn_G2vwtdB9xuA_UuBSLVgG';
const ADMIN_EMAIL = '411249585@qq.com';
const EXCL = ['待上线','闭店','停业'];
const UP = '#00c853', DN = '#f0138d', MUT = '#8a8a8e', DY = '#0a84ff', MT = '#ff9500';
const $id = (i)=>document.getElementById(i);
const esc = (s)=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 会话 ---------- */
let session = null;
try{ session = JSON.parse(localStorage.getItem('ops_session')||'null'); }catch(e){}
async function authPost(path, body){
  const r = await fetch(SB_URL+path, { method:'POST', headers:{'apikey':SB_KEY,'Content-Type':'application/json'}, body:JSON.stringify(body||{}) });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error_description||d.msg||d.message||('HTTP '+r.status));
  return d;
}
async function ensureSession(){
  if(!session) throw new Error('未登录，请先从运营后台登录');
  const exp = session.expires_at||0;
  if(exp*1000 - Date.now() < 120000){
    const d = await authPost('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token});
    session = d; localStorage.setItem('ops_session', JSON.stringify(d));
  }
}
async function sb(path, opts){
  opts = opts||{};
  await ensureSession();
  const h = Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'}, opts.headers||{});
  let r = await fetch(SB_URL+path, Object.assign({},opts,{headers:h}));
  if(r.status===401){
    const d = await authPost('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token});
    session = d; localStorage.setItem('ops_session', JSON.stringify(d));
    h['Authorization'] = 'Bearer '+session.access_token;
    r = await fetch(SB_URL+path, Object.assign({},opts,{headers:h}));
  }
  return r;
}

/* ---------- 日期工具（全站北京时间口径） ---------- */
function mondayOf(ds){ const d=new Date(ds+'T00:00:00'); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return d; }
function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
const TODAY = iso(new Date());
const CUR = addD(mondayOf(TODAY), -7);      // 复盘周 = 上一个完整自然周（周一）
const CURR = addD(CUR, 6);
const PREV = addD(CUR, -7);
const LAG4 = addD(CUR, -28);                // 上月同期周
const TREND0 = addD(CUR, -49);              // 趋势图最早一周
const P4 = [0,1,2,3].map(i=>iso(addD(CUR,-28+i*7)));  // 前4周基准（含前一周）
const needStart = iso(TREND0);
const ms = new Date(CURR.getFullYear(), CURR.getMonth(), 1);
const mlen = Math.round((CURR-ms)/86400000)+1;
const MS = iso(ms);
const pms = new Date(CURR.getFullYear(), CURR.getMonth()-1, 1);
const PMS = iso(pms), PME = iso(addD(pms, mlen-1));

/* ---------- 数据拉取 ---------- */
async function fetchAll(){
  let out=[], off=0;
  while(true){
    const r = await sb('/rest/v1/chain_verify_orders?select=store_id,platform,biz,amount,done_time&done_time=gte.'+needStart+'&order=done_time.asc', {headers:{'Range':off+'-'+(off+999)}});
    if(!r.ok) throw new Error('订单拉取失败 HTTP '+r.status);
    const b = await r.json();
    out = out.concat(b);
    if(b.length < 1000) break;
    off += 1000;
  }
  const rs = await sb('/rest/v1/stores?select=id,std_name,status,store_type,operator,city&order=id.asc');
  if(!rs.ok) throw new Error('门店表拉取失败 HTTP '+rs.status);
  const stores = await rs.json();
  let events = [];
  try{
    const re = await sb('/rest/v1/store_special_periods?select=*&order=start_date.desc');
    if(re.ok) events = await re.json();
  }catch(e){}
  return {orders:out, stores, events};
}

/* ---------- 主流程 ---------- */
(async function main(){
  try{
    const {orders, stores, events} = await fetchAll();
    $id('loading').style.display='none';
    $id('app').style.display='';
    render(orders, stores, events);
  }catch(e){
    $id('loading').style.display='none';
    const eb = $id('errbox');
    eb.style.display='';
    eb.innerHTML = '<b>加载失败：</b>'+esc(e.message)+'<br><span style="font-size:12px;color:#8a6">请确认已在运营后台登录；若刚导入完数据请稍候重试。</span>';
  }
})();

function render(orders, stores, events){
  const stMap = {}; stores.forEach(s=>stMap[s.id]=s);
  const operators = [...new Set(stores.map(s=>(s.operator||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));

  /* 聚合 */
  const wk={}, stW={}, stPf={}, stMonth={}, stDaily={};
  let evHits = {};
  for(const e of events){
    const st = stMap[e.store_id]; if(!st) continue;
    (evHits[st.std_name]=evHits[st.std_name]||[]).push(e);
  }
  function evInWeek(s){
    return (evHits[s]||[]).filter(e=>{
      const a=e.start_date, b=e.end_date||TODAY;
      return a<=iso(CURR) && b>=iso(CUR);
    });
  }
  for(const o of orders){
    if(o.platform!=='抖音'&&o.platform!=='美团') continue;
    if(!(o.biz==='核销'||o.biz==='验券'||o.biz==='记账核销')) continue;
    const d=(o.done_time||'').slice(0,10); if(!d) continue;
    const st=stMap[o.store_id]; if(!st) continue;
    const m=iso(mondayOf(d));
    wk[m]=wk[m]||{amt:0,cnt:0,pf:{}};
    wk[m].amt+=Number(o.amount)||0; wk[m].cnt++;
    wk[m].pf[o.platform]=(wk[m].pf[o.platform]||0)+(Number(o.amount)||0);
    if(o.biz==='记账核销'){ wk[m].bk=(wk[m].bk||0)+(Number(o.amount)||0); wk[m].pfBk=wk[m].pfBk||{}; wk[m].pfBk[o.platform]=(wk[m].pfBk[o.platform]||0)+(Number(o.amount)||0); }
    if(EXCL.includes(st.status)) continue;
    const s=st.std_name;
    stW[s]=stW[s]||{}; stW[s][m]=stW[s][m]||[0,0];
    stW[s][m][0]+=Number(o.amount)||0; stW[s][m][1]++;
    stPf[s]=stPf[s]||{}; stPf[s][m]=stPf[s][m]||{};
    stPf[s][m][o.platform]=(stPf[s][m][o.platform]||0)+(Number(o.amount)||0);
    if(d>=MS){ (stMonth[s]=stMonth[s]||[0,0])[0]+=Number(o.amount)||0; }
    else if(d>=PMS&&d<=PME){ (stMonth[s]=stMonth[s]||[0,0])[1]+=Number(o.amount)||0; }
    stDaily[s]=stDaily[s]||{cur:[0,0,0,0,0,0,0],prev:[0,0,0,0,0,0,0]};
    if(d>=iso(CUR)&&d<=iso(CURR)) stDaily[s].cur[Math.round((new Date(d+'T00:00:00')-CUR)/86400000)]+=Number(o.amount)||0;
    else if(d>=iso(PREV)&&d<=iso(addD(PREV,6))) stDaily[s].prev[Math.round((new Date(d+'T00:00:00')-PREV)/86400000)]+=Number(o.amount)||0;
  }

  const pct=(a,b)=> b? (a/b-1)*100 : 0;
  const money=x=>'¥'+Math.round(x);
  const sign=x=>(x>=0?'+':'')+'%'+x.toFixed(1);
  function delta(x){
    if(Math.abs(x)<0.05) return '<span class="delta" style="color:'+MUT+'">持平</span>';
    const col=x>0?UP:DN, ar=x>0?'↑':'↓';
    return '<span class="delta" style="color:'+col+'">'+ar+' '+sign(x).replace('%','')+'%</span>';
  }
  const oload=ms2=>{ const o={amt:0,cnt:0,pf:{}}; ms2.forEach(m=>{ const w=wk[m]; if(!w)return; o.amt+=w.amt;o.cnt+=w.cnt; for(const k in w.pf)o.pf[k]=(o.pf[k]||0)+w.pf[k]; }); return o; };
  const cw=oload([iso(CUR)]), pw=oload([iso(PREV)]), lw=oload([iso(LAG4)]);
  const p4=oload(P4);

  /* 自适应阈值 / 停业可比 辅助 */
  const wkKeys = Array.from({length:8},(_,i)=>iso(addD(CUR,-49+i*7)));
  const cwBk = (wk[iso(CUR)]||{}).bk||0;
  const cwPfBk = (wk[iso(CUR)]||{}).pfBk||{};
  function stat(arr){
    const a=arr.filter(v=>typeof v==='number'&&isFinite(v));
    const n=a.length; if(!n) return {n:0,mean:0,std:0,median:0};
    const mean=a.reduce((x,y)=>x+y,0)/n;
    const std=Math.sqrt(a.reduce((x,y)=>x+(y-mean)**2,0)/(n-1||1));
    const s=[...a].sort((x,y)=>x-y);
    const median = n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2;
    return {n,mean,std,median};
  }
  function businessDays(s, ds, de){
    const evs = evHits[s]||[];
    let busy=0;
    const d0=new Date(ds+'T00:00:00'), d1=new Date(de+'T00:00:00');
    for(let d=new Date(d0); d<=d1; d.setDate(d.getDate()+1)){
      const isoD=iso(d);
      const closed = evs.some(e=>{ const a=e.start_date, b=e.end_date||TODAY; return a<=isoD && b>=isoD; });
      if(!closed) busy++;
    }
    return busy;
  }

  /* 诊断 */
  const allStd=Object.keys(stW).sort();
  const gainers=[],droppers=[],blank=[],cont_down=[],aov_odd=[],pf_odd=[],closedStores=[];
  for(const s of allStd){
    const c=stW[s][iso(CUR)]||[0,0], p=stW[s][iso(PREV)]||[0,0];
    const base4=P4.reduce((a,m)=>a+((stW[s][m]||[0,0])[0]),0);
    const cnt4=P4.reduce((a,m)=>a+((stW[s][m]||[0,0])[1]),0);
    const wk4=base4/4;
    const evs=evInWeek(s), evHard=evs.filter(e=>['培训闭店','团建闭店','台风闭店','假日闭店','装修调整'].includes(e.special_type));
    const closed = evHard.length>0;
    if(closed){ closedStores.push([s,evHard]); continue; }   // 停业店不进任何涨跌/预警榜，单独做可比日均
    // 该店近 8 周自身统计（自适应阈值）
    const series = wkKeys.map(m=>(stW[s][m]?stW[s][m][0]:0));
    const p50 = stat(series).median;
    const deltas=[]; for(let i=1;i<series.length;i++){ if(series[i-1]>0) deltas.push((series[i]-series[i-1])/series[i-1]); }
    const dropStd = deltas.length>=5 ? stat(deltas).std : 0;
    const aovSeries = wkKeys.map(m=>{ const w=stW[s][m]; return (w&&w[1]>0)?w[0]/w[1]:null; }).filter(v=>v!=null);
    const aovStd = aovSeries.length>=5 ? stat(aovSeries).std : 0;
    const mtShareSeries = wkKeys.map(m=>{ const w=stW[s][m]; if(!w||w[0]<=0) return null; const mt=((stPf[s]&&stPf[s][m])||{}).美团||0; return mt/w[0]; }).filter(v=>v!=null);
    const mtStd = mtShareSeries.length>=5 ? stat(mtShareSeries).std : 0;
    if(c[0]>0&&p[0]>0&&c[0]>=500) gainers.push([s,p[0],c[0],pct(c[0],p[0]),c[0]-p[0]]);
    if(p[0]>=Math.max(500,p50*0.5)&&c[0]<p[0]) droppers.push([s,p[0],c[0],pct(c[0],p[0]),c[0]-p[0]]);
    if(c[0]===0&&p50>=Math.max(150,p50*0.3)) blank.push([s,wk4]);
    const w2=stW[s][iso(addD(PREV,-7))]||[0,0];
    const dropThr = dropStd>0?1.5*dropStd:0.10;
    if(w2[0]>=500&&w2[0]>p[0]&&p[0]>c[0]&&p[0]>0&&c[0]>0&&pct(p[0],w2[0])<=-(dropThr*100)&&pct(c[0],p[0])<=-(dropThr*100))
      cont_down.push([s,w2[0],p[0],c[0],pct(c[0],w2[0])]);
    if(c[1]>=10&&cnt4>=10){
      const ac=c[0]/c[1], ap=base4/cnt4;
      const aovThr = aovStd>0?1.5*aovStd:ap*0.2;
      if(Math.abs(ac-ap)>aovThr) aov_odd.push([s,ap,ac,pct(ac,ap),c[1]]);
    }
    if(c[0]>=2000&&base4>=2000){
      const mc=(stPf[s][iso(CUR)]||{}).美团||0, mp=P4.reduce((a,m)=>a+((stPf[s][m]||{}).美团||0),0);
      const dc=(stPf[s][iso(CUR)]||{}).抖音||0, dp=P4.reduce((a,m)=>a+((stPf[s][m]||{}).抖音||0),0);
      const mtThr = mtStd>0?1.5*mtStd:0.20;
      if(Math.abs(mc/c[0]-mp/base4)>mtThr) pf_odd.push({s,mtOld:mp/base4,mtNew:mc/c[0],dyOld:dp/base4,dyNew:dc/c[0]});
    }
  }
  gainers.sort((a,b)=>b[4]-a[4]); droppers.sort((a,b)=>a[4]-b[4]);

  const dWow=pct(cw.amt,pw.amt), d4w=pct(cw.amt,lw.amt);
  const tw=dWow<-5?'下滑':(dWow>5?'上涨':'持平');

  /* 结论 */
  let C='';
  C+='<li>上周大盘'+tw+(Math.abs(dWow)>=0.05?'（'+sign(dWow).replace('%','')+'%）':'')+'，核销'+money(cw.amt)+' / '+cw.cnt+'单；较上月同期 '+sign(d4w).replace('%','')+'%。</li>';
  const mtC=cw.pf.美团||0, dyC=cw.pf.抖音||0;
  C+='<li>平台结构：美团占'+Math.round(mtC*100/Math.max(cw.amt,1))+'%、抖音占'+Math.round(dyC*100/Math.max(cw.amt,1))+'%；抖音环比 '+sign(pct(dyC,pw.pf.抖音||0)).replace('%','')+'%、美团环比 '+sign(pct(mtC,pw.pf.美团||0)).replace('%','')+'%。</li>';
  if(gainers.length){ const g=gainers[0]; C+='<li>最亮门店：'+esc(g[0])+'，周环比 '+sign(g[3]).replace('%','')+'%（'+money(g[1])+' → '+money(g[2])+'）。</li>'; }
  if(droppers.length){ const d0=droppers[0]; C+='<li>最大下滑：'+esc(d0[0])+'，周环比 '+sign(d0[3]).replace('%','')+'%（'+money(d0[1])+' → '+money(d0[2])+'）。</li>'; }
  if(blank.length) C+='<li>裸奔预警 '+blank.length+' 家（自身近8周常态周核销≥¥150 但上周零核销，阈值已自适应）。</li>';
  if(closedStores.length) C+='<li>有因停业 '+closedStores.length+' 家（特殊门店填报命中，已在预警区单列可比日均，不计入涨跌/预警榜）。</li>';
  if(cont_down.length) C+='<li>连续两周下滑 '+cont_down.length+' 家，建议优先安排回访。</li>';
  if(Object.keys(evHits).some(s=>evInWeek(s).length)) C+='<li>上周有 '+allStd.filter(s=>evInWeek(s).length).length+' 家门店命中特殊门店填报，相关环比已可结合事件解读。</li>';

  /* 大盘 */
  let H='<div class="hero"><h1>连锁门店运营周诊断</h1><div class="sub">复盘上周 '+iso(CUR)+'（周一）~ '+iso(CURR)+'（周日） · 数据截至 '+TODAY+' 实时拉取 · 平台账单口径</div></div>';
  H+='<section><h2>上周结论<span class="badge">先看这里</span></h2><ul class="concl">'+C+'</ul></section>';
  H+='<section><h2>大盘速览<span class="badge" style="margin-left:8px;font-weight:400">核销口径 '+iso(CUR)+' ~ '+iso(CURR)+'</span></h2><div class="kgrid">'
    +'<div class="kpi"><div class="kpi-l">核销金额 <span class="tag" style="background:#e8f0ff;color:#0a84ff">账单导入·真实业绩</span></div><div class="kpi-v">'+money(cw.amt)+'</div><div class="kpi-s">环比 '+delta(dWow)+' · 对比上月同期 '+delta(d4w)+'</div><div class="kpi-s" style="color:#8a6d00">后台记账 '+money(cwBk)+'（占 '+(cwBk*100/Math.max(cw.amt,1)).toFixed(0)+'%）· 其余为券核销自动回传</div></div>'
    +'<div class="kpi"><div class="kpi-l">核销单数</div><div class="kpi-v">'+cw.cnt+' 单</div><div class="kpi-s">环比 '+delta(pct(cw.cnt,pw.cnt||1))+'</div></div>'
    +'</div></section>';

  /* 平台 */
  let pr='';
  [['抖音',dyC],['美团',mtC]].forEach(([nm,a])=>{
    const b=(pw.pf[nm]||0), c=(lw.pf[nm]||0);
    const bk=(cwPfBk[nm])||0, bkPct=a>0?Math.round(bk*100/a):0;
    pr+='<tr><td>'+nm+'</td><td>'+money(a)+'<div style="font-size:10px;color:#8a8a8e;margin-top:2px">后台记账 '+money(bk)+'（'+bkPct+'%）</div></td><td>'+Math.round(a*100/Math.max(cw.amt,1))+'%</td><td>'+delta(pct(a,b))+'</td><td>'+delta(pct(a,c))+'</td></tr>';
  });
  H+='<section><h2>平台结构</h2><table><thead><tr><th>平台</th><th>金额</th><th>占比</th><th>环比</th><th>对比上月同期</th></tr></thead><tbody>'+pr+'</tbody></table></section>';

  /* 趋势（8 周堆叠柱） */
  const weeks=[]; for(let i=0;i<8;i++) weeks.push(addD(CUR,-49+i*7));
  const mx=Math.max(...weeks.map(m=>(wk[iso(m)]||{amt:0}).amt),1);
  const W=640,Hh=230,pad=40,bw=(W-pad*2)/weeks.length,base=Hh-30;
  let bars='<rect x="'+(W-160)+'" y="8" width="12" height="12" rx="3" fill="'+DY+'"/><text x="'+(W-144)+'" y="18" class="axl">抖音</text>'
          +'<rect x="'+(W-90)+'" y="8" width="12" height="12" rx="3" fill="'+MT+'"/><text x="'+(W-74)+'" y="18" class="axl">美团</text>';
  weeks.forEach(m=>{
    const w=wk[iso(m)]||{amt:0,pf:{}};
    const dyv=w.pf.抖音||0, mtv=w.pf.美团||0, tot=dyv+mtv;
    const hMt=(Hh-62)*mtv/mx, hDy=(Hh-62)*dyv/mx;
    const x=pad+(m.getTime()-weeks[0].getTime())/(7*86400000)*bw;
    if(hMt>0.5) bars+='<rect x="'+(x+3).toFixed(1)+'" y="'+(base-hMt).toFixed(1)+'" width="'+(bw-6).toFixed(1)+'" height="'+hMt.toFixed(1)+'" fill="'+MT+'"/>';
    if(hDy>0.5) bars+='<rect x="'+(x+3).toFixed(1)+'" y="'+(base-hMt-hDy).toFixed(1)+'" width="'+(bw-6).toFixed(1)+'" height="'+hDy.toFixed(1)+'" rx="3" fill="'+DY+'"/>';
    /* X 轴标注：M/D（周一）＋ 每柱代表周一~周日的提示 */
    const isCur = (iso(m)===iso(CUR));
    bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(Hh-12)+'" class="ax'+(isCur?' ax-cur':'')+'" text-anchor="middle">'+(m.getMonth()+1)+'/'+m.getDate()+'</text>';
    if(tot>0) bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(base-hMt-hDy-6).toFixed(1)+'" class="axv" text-anchor="middle">'+(tot>=10000?(tot/10000).toFixed(1)+'万':Math.round(tot))+'</text>';
    if(hDy>=16) bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(base-hMt-hDy/2+3).toFixed(1)+'" class="axw" text-anchor="middle">'+(dyv>=10000?(dyv/10000).toFixed(1)+'万':Math.round(dyv))+'</text>';
    if(hMt>=16) bars+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(base-hMt/2+3).toFixed(1)+'" class="axb" text-anchor="middle">'+(mtv>=10000?(mtv/10000).toFixed(1)+'万':Math.round(mtv))+'</text>';
  });
  H+='<section><h2>核销趋势（完整自然周 · 抖音/美团堆叠）'
    +'<span class="badge" style="margin-left:8px;font-weight:400">近8周 '+iso(weeks[0])+' ~ '+iso(CURR)+'，最右一根=本周 '+iso(CUR)+'~'+iso(CURR)+'</span>'
    +'</h2><svg viewBox="0 0 '+W+' '+Hh+'" class="chart">'+bars+'</svg></section>';

  /* 涨跌榜 */
  function rankTable(items,inv){
    let r='';
    items.slice(0,8).forEach(([s,p,c,x])=>{
      r+='<tr><td><span class="stname" data-s="'+esc(s)+'">'+esc(s)+'</span></td><td>'+money(p)+'</td><td>'+money(c)+'</td><td>'+delta(x)+'</td></tr>';
    });
    return '<table><thead><tr><th>门店</th><th>前一周</th><th>上周</th><th>环比</th></tr></thead><tbody>'+r+'</tbody></table>'
      +'<div class="note">👆 点击门店名展开：平台拆分 + 两周逐日对比</div>';
  }
  H+='<section><h2>增长榜 TOP8<span class="badge">周环比</span></h2>'+(gainers.length?rankTable(gainers):'<div class="empty">上周无符合统计条件的增长门店（上周≥¥500 且前一周有基数）</div>')+'</section>';
  H+='<section><h2>下滑榜 TOP8<span class="badge">周环比·自适应阈值</span></h2>'+(droppers.length?rankTable(droppers):'<div class="empty">上周无显著下滑门店</div>')+'</section>';

  /* 预警 */
  let wn='';
  if(blank.length){
    wn+='<div class="warn"><span class="wt">🚨 裸奔预警 · '+blank.length+' 家</span><br>上周零核销：'+blank.map(([s,w])=>'<b>'+esc(s)+'</b>（近4周周均'+money(w)+'）').join('、')+'。</div>';
  }
  if(closedStores.length){
    wn+='<div class="warn"><span class="wt">🏷️ 有因停业 · '+closedStores.length+' 家（不报警，仅做可比日均）</span>';
    closedStores.forEach(([s,evs])=>{
      const curAmt=(stW[s][iso(CUR)]||[0,0])[0], curBusy=businessDays(s,iso(CUR),iso(CURR));
      const prevAmt=(stW[s][iso(PREV)]||[0,0])[0], prevBusy=businessDays(s,iso(PREV),iso(addD(PREV,6)));
      const lmAmt=(stMonth[s]||[0,0])[1], lmBusy=businessDays(s,PMS,PME);
      const curDay=curBusy>0?curAmt/curBusy:0, prevDay=prevBusy>0?prevAmt/prevBusy:0, lmDay=lmBusy>0?lmAmt/lmBusy:0;
      const uniqEvs=[...new Map(evs.map(e=>[e.special_type+'|'+e.start_date+'|'+(e.end_date||''),e])).values()];
      const evFmt=e=>{
        const md=d=>d.slice(5).replace('-','/');
        const days=e.end_date?Math.round((new Date(e.end_date)-new Date(e.start_date))/864e5)+1:'';
        return esc(e.special_type)+'（'+md(e.start_date)+(e.end_date?' ~ '+md(e.end_date)+' · '+days+'天':' 起')+'）';
      };
      let line=esc(s)+'：'+uniqEvs.map(evFmt).join('、');
      if(curBusy===0) line+=' → 整周停业（无可比营业日）';
      else{
        line+=' → 本周营业'+curBusy+'天，日均'+money(curDay);
        if(curBusy>=3){
          if(prevBusy>0&&prevAmt>0) line+=' ｜ 上周日均'+money(prevDay)+'（'+delta(pct(curDay,prevDay))+'）';
          if(lmBusy>0&&lmAmt>0) line+=' ｜ 上月营业日均'+money(lmDay)+'（'+delta(pct(curDay,lmDay))+'）';
        }else line+='（营业日不足3天，不报环比）';
      }
      wn+='<br>'+line;
    });
    wn+='</div>';
  }
  if(cont_down.length){
    wn+='<div class="warn"><span class="wt">📉 连续两周下滑 · '+cont_down.length+' 家</span><br>'+cont_down.map(([s,a,b,c,x])=>esc(s)+'：'+money(a)+' → '+money(b)+' → '+money(c)+'（两周累计 <span style="color:'+DN+'">'+sign(x).replace('%','')+'%</span>）').join('<br>')+'</div>';
  }
  if(pf_odd.length){
    wn+='<div class="warn"><span class="wt">🔀 平台结构异动 · '+pf_odd.length+' 家</span><br>'+pf_odd.slice(0,6).map(({s,mtOld,mtNew,dyOld,dyNew})=>{
      const parts=[];
      if(mtNew>mtOld) parts.push('<span style="color:#f97316;font-weight:600">美团占比 '+Math.round(mtOld*100)+'% → '+Math.round(mtNew*100)+'% ↑</span>');
      if(dyNew>dyOld) parts.push('<span style="color:#7c5cff;font-weight:600">抖音占比 '+Math.round(dyOld*100)+'% → '+Math.round(dyNew*100)+'% ↑</span>');
      return esc(s)+'：'+(parts.length?parts.join(' ｜ '):'—');
    }).join('<br>')+'</div>';
  }
  if(!wn) wn='<div class="warn">本周三项预警全部清洁 🎉</div>';
  H+='<section><h2>预警区<span class="badge">裸奔/连降/平台</span></h2><div class="warnbox">'+wn+'</div></section>';

  /* 特殊门店 */
  let ev='';
  ev+='<li><b>登记入口</b>：书荀连锁页「特殊门店填报」或 数据导入页「特殊门店填报」——两处同一份数据（store_special_periods），实时同步。填门店 + 起止日期 + 类型，报告自动归因。命中门店已在上方「预警区·有因停业」单列可比日均。</li>';
  H+='<section><h2>特殊门店联动<span class="badge">已接入</span></h2><ul class="concl" style="font-size:13.5px">'+ev+'</ul></section>';

  /* 门店数据对比总表 */
  let opsSel='<option value="">全部运营人</option>';
  operators.forEach(o=>{
    const n=stores.filter(s=>(s.operator||'').trim()===o).length;
    opsSel+='<option value="'+esc(o)+'">'+esc(o)+'（'+n+' 家）</option>';
  });
  H+='<section><h2>门店数据对比<span class="badge">全门店</span></h2>'
    +'<div class="selrow"><select id="opSel">'+opsSel+'</select><span class="note" style="margin:0">列头点击排序 · 点店名展开平台拆分</span></div>'
    +'<table id="allTbl"><thead><tr>'
    +'<th data-k="name">店名</th><th data-k="op">运营人</th>'
    +'<th data-k="c" title="复盘周 '+iso(CUR)+' ~ '+iso(CURR)+'">复盘周<span style="display:block;font-weight:400;font-size:10px;color:#8a8a8e">'+iso(CUR).slice(5)+'~'+iso(CURR).slice(5)+'</span></th>'
    +'<th data-k="p" title="上一自然周 '+iso(PREV)+' ~ '+iso(addD(PREV,6))+'">上周<span style="display:block;font-weight:400;font-size:10px;color:#8a8a8e">'+iso(PREV).slice(5)+'~'+iso(addD(PREV,6)).slice(5)+'</span></th>'
    +'<th data-k="mc">本月累计<span style="display:block;font-weight:400;font-size:10px;color:#8a8a8e">'+MS.slice(5)+'~'+iso(CURR).slice(5)+'</span></th>'
    +'<th data-k="mom">对比上月同期<span style="display:block;font-weight:400;font-size:10px;color:#8a8a8e">'+PMS.slice(5)+'~'+PME.slice(5)+'</span></th>'
    +'</tr></thead><tbody id="allBody"></tbody></table></section>';

  H+='<div class="foot">口径说明：金额=平台核销（抖音=核销+记账核销，美团=验券+记账核销）；不含内购上翻；'
    +'<b>来源标签</b>：全部金额来自每周账单导入（chain_verify_orders），其中「券核销」=抖音来客/美团开店宝自动回传、「后台记账」=门店在有赞后台手工记账，<b>二者均为真实业绩、仅核销通道不同</b>；'
    +'待上线/闭店/停业门店不计入门店诊断；「对比上月同期」= -28 天同星期对齐（大盘）/ 同长度月窗口（本月列）；'
    +'本月累计='+MS+'~'+iso(CURR)+'，上月同期='+PMS+'~'+PME+'；环比=对上一自然周。'
    +'预警阈值已改为按各店近 8 周自身水平自适应（裸奔/下滑/连降/平台结构），停业店单列可比日均、不计入预警榜。'
    +'数据源：chain_verify_orders（每周账单导入）· 生成于 '+TODAY+'</div>';

  $id('app').innerHTML=H;

  /* ---- 交互：总表排序/筛选 + 展开行 ---- */
  const STO={};
  const opMap={};
  stores.forEach(x=>{ opMap[(x.std_name||'').trim()]=(x.operator||'').trim(); });
  allStd.forEach(s=>{
    const c=(stW[s][iso(CUR)]||[0,0])[0], p=(stW[s][iso(PREV)]||[0,0])[0];
    const mo=stMonth[s]||[0,0];
    STO[s]={c,p,mc:mo[0],mp:mo[1],
      dy:(stPf[s][iso(CUR)]||{}).抖音||0, mt:(stPf[s][iso(CUR)]||{}).美团||0,
      op:opMap[(s||'').trim()]||'',
      tag:evInWeek(s).map(e=>e.special_type).join('、')};
  });
  const DIAG=stDaily;
  const fmt=v=>String(Math.round(v));
  function pctCell(a,b){
    if(!b) return a>0?'<span style="color:'+UP+';font-weight:600">新增</span>':'<span style="color:'+MUT+'">—</span>';
    const x=(a/b-1)*100, col=x>=0?UP:DN, ar=x>=0?'↑':'↓';
    return '<span style="color:'+col+';font-weight:600">'+ar+' '+Math.abs(x).toFixed(1)+'%</span>';
  }
  let sortK='c', sortDir=-1, opFilter='';
  function renderTbl(){
    const rows=Object.keys(STO).filter(s=>!opFilter||STO[s].op===opFilter).map(s=>Object.assign({s},STO[s]));
    rows.forEach(r=>{ r.wow=r.p>0?r.c/r.p-1:(r.c>0?9e9:-1); r.mom=r.mp>0?r.mc/r.mp-1:(r.mc>0?9e9:-1); });
    rows.sort((a,b)=>((sortK==='name'||sortK==='op')? String(a[sortK==='name'?'s':sortK]).localeCompare(String(b[sortK==='name'?'s':sortK]),'zh')*sortDir : (a[sortK]-b[sortK])*sortDir));
    $id('allBody').innerHTML=rows.map(r=>
      '<tr><td><span class="stname" data-s="'+esc(r.s)+'">'+esc(r.s)+'</span>'+(r.tag?'<span class="tag" style="background:#fff3e0;color:#b5651d">'+esc(r.tag)+'</span>':'')+'</td>'
      +'<td style="color:#5a6b80;white-space:nowrap">'+esc(r.op||'—')+'</td>'
      +'<td style="font-weight:700">'+fmt(r.c)+'</td>'
      +'<td>'+fmt(r.p)+' '+pctCell(r.c,r.p)+'</td>'
      +'<td>'+fmt(r.mc)+'</td>'
      +'<td>'+fmt(r.mp)+' '+pctCell(r.mc,r.mp)+'</td></tr>'
    ).join('');
  }
  const opSelEl=$id('opSel');
  if(opSelEl) opSelEl.addEventListener('change',()=>{ opFilter=opSelEl.value; renderTbl(); });
  document.querySelectorAll('#allTbl th').forEach(th=>{
    th.style.cursor='pointer';
    th.addEventListener('click',()=>{ const k=th.dataset.k; if(!k)return;
      if(k===sortK) sortDir*=-1; else { sortK=k; sortDir=-1; }
      renderTbl(); });
  });
  renderTbl();

  function miniSvg(s){
    const d=DIAG[s]; if(!d) return '';
    const w=640,h=240,p=40;
    const all=d.cur.concat(d.prev);
    const mx2=Math.max.apply(null,all.concat([1]));
    const X=i=>p+i*(w-2*p)/6, Y=v=>h-40-(h-92)*v/mx2;
    const dots=(a,col)=>a.map((v,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.6" fill="'+col+'"/>').join('');
    const tot=a=>a.reduce((x,y)=>x+y,0);
    const wd=['一','二','三','四','五','六','日'];
    let g='<text x="'+p+'" y="22" font-size="13" font-weight="600" fill="'+UP+'">● 上周（复盘周）· '+fmt(tot(d.cur))+'</text>'
        +'<text x="'+(p+190)+'" y="22" font-size="13" font-weight="600" fill="'+MUT+'">● 前一周 · '+fmt(tot(d.prev))+'</text>'
        +'<polyline points="'+d.prev.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'" fill="none" stroke="#b9b9be" stroke-width="2.4" stroke-dasharray="6 5"/>'+dots(d.prev,'#b9b9be')
        +'<polyline points="'+d.cur.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'" fill="none" stroke="'+UP+'" stroke-width="3"/>'+dots(d.cur,UP);
    wd.forEach((w2,i)=>{ g+='<text x="'+X(i).toFixed(1)+'" y="'+(h-18)+'" font-size="13" fill="#8a8a8e" text-anchor="middle">周'+w2+'</text>'; });
    g+='<line x1="'+p+'" y1="'+(h-40)+'" x2="'+(w-p)+'" y2="'+(h-40)+'" stroke="#e5e5ea" stroke-width="1"/>';
    return '<svg viewBox="0 0 '+w+' '+h+'" class="chart-mini">'+g+'</svg>';
  }
  document.addEventListener('click',function(e){
    const el=e.target.closest?e.target.closest('.stname'):null;
    if(!el) return;
    const tr=el.closest('tr');
    const nxt=tr.nextElementSibling;
    if(nxt&&nxt.classList.contains('drow')){ nxt.remove(); return; }
    document.querySelectorAll('tr.drow').forEach(x=>x.remove());
    const s=el.dataset.s, d=STO[s]; if(!d) return;
    const row=document.createElement('tr'); row.className='drow';
    const split='<div style="font-size:12px;color:#6e6e73;margin:6px 2px">复盘周平台拆分：<b style="color:'+DY+'">抖音 '+fmt(d.dy)+'</b> · <b style="color:#c77700">美团 '+fmt(d.mt)+'</b></div>';
    row.innerHTML='<td colspan="'+tr.children.length+'"><div style="max-width:760px;margin:0 auto">'+split+miniSvg(s)+'</div></td>';
    tr.after(row);
  });
}
</script>
</body>
</html>
