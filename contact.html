<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>書荀总部通讯录</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root{
    --bg:#f4f5f9; --card:#ffffff; --ink:#1f2330; --sub:#8a8f9e;
    --line:#e6e8ef; --blue:#1d4ed8; --bluebg:#eff6ff;
  }
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:560px; margin:0 auto; padding:0 0 40px; }
  header.top{
    position:sticky; top:0; z-index:20; background:rgba(244,245,249,.92);
    backdrop-filter:saturate(180%) blur(12px); padding:14px 16px 10px;
    border-bottom:1px solid var(--line);
  }
  .brand{ font-size:12px; color:var(--sub); letter-spacing:1px; margin-bottom:6px; }
  .titlerow{ display:flex; align-items:baseline; justify-content:space-between; }
  h1{ font-size:20px; font-weight:800; margin:0; letter-spacing:1px; }
  .total{ font-size:12px; color:var(--sub); }
  .search{
    margin-top:10px; display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:9px 12px;
  }
  .search svg{ width:16px; height:16px; color:var(--sub); flex:none; }
  .search input{
    border:0; outline:0; background:transparent; flex:1; font-size:14px; color:var(--ink);
  }
  .chips{ display:flex; gap:8px; overflow-x:auto; padding:12px 16px 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex:none; font-size:13px; font-weight:600; padding:6px 13px; border-radius:999px;
    background:#fff; border:1px solid var(--line); color:var(--ink); cursor:pointer; white-space:nowrap;
  }
  .chip.on{ background:var(--blue); border-color:var(--blue); color:#fff; }
  .group{ padding:8px 16px 0; }
  .ghead{ display:flex; align-items:center; gap:8px; margin:14px 2px 8px; }
  .ghead .name{ font-size:15px; font-weight:800; }
  .ghead .cnt{ font-size:12px; color:var(--sub); background:#fff; border:1px solid var(--line); border-radius:999px; padding:1px 9px; }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:10px;
  }
  .crow{ display:flex; gap:12px; align-items:flex-start; }
  .ava{
    width:44px; height:44px; border-radius:50%; flex:none; color:#fff; font-weight:800;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .cbody{ flex:1; min-width:0; }
  .cname{ font-size:16px; font-weight:700; }
  .ctitle{ font-size:12px; color:var(--blue); font-weight:600; margin-top:1px; }
  .cduty{ font-size:12.5px; color:#5b6072; margin-top:6px; line-height:1.55; }
  .cphone{
    display:flex; align-items:center; gap:10px; margin-top:10px; padding-top:10px;
    border-top:1px dashed var(--line);
  }
  .cphone a.call{
    display:flex; align-items:center; gap:6px; flex:1; text-decoration:none;
    color:var(--ink); font-size:14px; font-weight:600; min-width:0;
  }
  .cphone a.call svg{ width:15px; height:15px; color:var(--blue); flex:none; }
  .cphone a.call .num{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .copy{
    flex:none; font-size:12px; font-weight:600; color:var(--blue); background:var(--bluebg);
    border:0; border-radius:9px; padding:7px 12px; cursor:pointer;
  }
  .empty{ text-align:center; color:var(--sub); padding:48px 16px; font-size:14px; }
  #toast{
    position:fixed; left:50%; bottom:40px; transform:translateX(-50%) translateY(20px);
    background:rgba(31,35,48,.92); color:#fff; font-size:13px; padding:9px 18px; border-radius:10px;
    opacity:0; pointer-events:none; transition:.22s; z-index:50;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  footer{ text-align:center; color:var(--sub); font-size:11px; padding:18px 16px 0; }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">書荀 · SHUXUN</div>
    <div class="titlerow">
      <h1>書荀总部通讯录</h1>
      <span class="total" id="total"></span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="search" inputmode="search" placeholder="搜姓名 / 职位 / 部门 / 电话" autocomplete="off" />
    </div>
  </header>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</div>
<div id="toast"></div>

<script>
var DEPT_ORDER = ["高层","财务部","网络营销部","监察部","人事部","产品部","工程部","教育部","市场拓展","人力资源","文宣部"];
var PALETTE = ["#e0567a","#1d4ed8","#0ea5a4","#d97706","#7c3aed","#0d9488","#db2777","#2563eb","#ca8a04","#059669","#9333ea","#dc2626"];
var DATA = { people: [] };

function hashColor(s){
  var h=0; for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; }
  return PALETTE[h % PALETTE.length];
}
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];}); }
function toast(msg){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove("show"); },1400);
}
function copyText(txt){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast("已复制："+txt); }, fallback);
  } else { fallback(); }
  function fallback(){
    try{
      var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
      toast("已复制："+txt);
    }catch(e){ toast("复制失败，请长按号码"); }
  }
}

function render(people){
  var list=document.getElementById("list");
  var q=(document.getElementById("q").value||"").trim().toLowerCase();
  var active=document.querySelector(".chip.on");
  var deptFilter = active ? active.getAttribute("data-dept") : "全部";

  var filtered = people.filter(function(p){
    if(deptFilter!=="全部" && p.dept!==deptFilter) return false;
    if(q){
      var hay=(p.name+" "+p.dept+" "+p.title+" "+p.phone+" "+p.duty).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });

  if(!filtered.length){ list.innerHTML='<div class="empty">没有匹配的人 🐈‍⬛</div>'; return; }

  // 分组（按 DEPT_ORDER，未列出的排后面）
  var groups={}, order=[];
  filtered.forEach(function(p){
    if(!groups[p.dept]){ groups[p.dept]=[]; order.push(p.dept); }
    groups[p.dept].push(p);
  });
  order.sort(function(a,b){
    var ia=DEPT_ORDER.indexOf(a), ib=DEPT_ORDER.indexOf(b);
    if(ia<0) ia=999; if(ib<0) ib=999; return ia-ib;
  });

  var html="";
  order.forEach(function(d){
    var arr=groups[d];
    html+='<div class="group"><div class="ghead"><span class="name">'+esc(d)+'</span><span class="cnt">'+arr.length+' 人</span></div>';
    arr.forEach(function(p){
      var initial=esc(p.name? p.name.charAt(0):"");
      html+='<div class="card"><div class="crow">'
        +'<div class="ava" style="background:'+hashColor(p.name||"")+'">'+initial+'</div>'
        +'<div class="cbody"><div class="cname">'+esc(p.name)+'</div>'
        +'<div class="ctitle">'+esc(p.title)+'</div>'
        + (p.duty?'<div class="cduty">'+esc(p.duty)+'</div>':'')
        +'</div></div>';
      if(p.phone){
        html+='<div class="cphone">'
          +'<a class="call" href="tel:'+esc(p.phone)+'">'
          +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.6a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>'
          +'<span class="num">'+esc(p.phone)+'</span></a>'
          +'<button class="copy" data-phone="'+esc(p.phone)+'">复制</button>'
          +'</div>';
      }
      html+='</div>';
    });
    html+='</div>';
  });
  list.innerHTML=html;
  list.querySelectorAll(".copy").forEach(function(b){
    b.addEventListener("click", function(){ copyText(b.getAttribute("data-phone")); });
  });
}

function buildChips(){
  var chips=document.getElementById("chips");
  var depts=[]; DATA.people.forEach(function(p){ if(depts.indexOf(p.dept)<0) depts.push(p.dept); });
  depts.sort(function(a,b){
    var ia=DEPT_ORDER.indexOf(a), ib=DEPT_ORDER.indexOf(b);
    if(ia<0) ia=999; if(ib<0) ib=999; return ia-ib;
  });
  var html='<div class="chip on" data-dept="全部">全部</div>';
  depts.forEach(function(d){ html+='<div class="chip" data-dept="'+esc(d)+'">'+esc(d)+'</div>'; });
  chips.innerHTML=html;
  chips.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      chips.querySelectorAll(".chip").forEach(function(x){ x.classList.remove("on"); });
      c.classList.add("on"); render(DATA.people);
    });
  });
}

function init(){
  document.getElementById("total").textContent = DATA.people.length ? ("共 "+DATA.people.length+" 人") : "";
  document.getElementById("foot").textContent = DATA.updated ? ("数据更新于 "+DATA.updated) : "";
  buildChips();
  render(DATA.people);
  document.getElementById("q").addEventListener("input", function(){ render(DATA.people); });
}

fetch("contact_data.json?_t=" + Date.now(), {cache:"no-store"})
  .then(function(r){ return r.json(); })
  .then(function(d){ DATA=d; init(); })
  .catch(function(e){
    document.getElementById("list").innerHTML='<div class="empty">数据加载失败，请稍后重试</div>';
  });
</script>
</body>
</html>
