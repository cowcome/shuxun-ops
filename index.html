<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>书荀互联网运营工作区</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f9;
    color: #1f2330;
    min-height: 100vh;
    padding: 16px 14px 48px;
    font-size: 14px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  .hero { text-align: center; padding: 16vh 16px 0; }
  .hero h1 {
    font-size: 32px; font-weight: 800; letter-spacing: 2px;
    color: #1f2330; margin: 0 0 14px;
  }
  .hero .sub { font-size: 13px; color: #b3b8c4; letter-spacing: 1px; }
  @media (max-width: 560px){ .hero h1 { font-size: 24px; } }
</style>
<script src="theme.js"></script></head>
<body>
<!-- ===== 统一导航壳：首页=根域名直接呈现（index.html 即首页，无跳转）；导航全员可见 ===== -->
<nav class="sx-nav" id="sxNav">
  <a class="sx-brand" href="index.html">书荀互联网运营工作区</a>
  <div class="sx-links">
    <a href="ops.html">佛山直营</a>
    <a href="chain.html">书荀连锁</a>
    <a href="chain_import.html">数据导入</a>
    <a href="chain_report.html" target="_blank" rel="noopener">周报诊断</a>
    <a href="douyin_pay.html" data-sx="admin" hidden>扫码上翻</a>
    <a href="dy_monitor.html" data-sx="admin" hidden>抖音查询</a>
    <a href="store_admin.html">门店管理</a>
    <a href="daily.html">每日填报</a>
  </div>
  <span class="sx-me" id="sxMe"></span>
</nav>
<style>
  .sx-nav{display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;margin-bottom:12px;flex-wrap:wrap;background:rgba(255,255,255,.92);border:1px solid #e6e8ef}
  .sx-nav a{font-size:13px;font-weight:600;color:#1f2330;text-decoration:none;padding:5px 11px;border-radius:8px;border:1px solid transparent;white-space:nowrap}
  .sx-nav a:hover{border-color:#d6d9e2}
  .sx-nav .sx-brand{font-weight:800;font-size:14px;padding-left:0}
  .sx-nav .sx-links{display:flex;gap:4px;flex-wrap:wrap}
  .sx-nav .sx-me{margin-left:auto;font-size:12px;color:#8a8f9e;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sx-nav a.cur{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
  .sx-nav a.sx-off{opacity:.4}
  .sx-nav .sx-name{font-weight:700;color:inherit}
  .sx-nav .sx-email{opacity:.65}
  .sx-nav a.sx-out{color:#ef4444;font-weight:700;margin-left:2px}
</style>
<link rel="stylesheet" href="apple.css">
<script>
(function(){
  var nav=document.getElementById('sxNav'); if(!nav) return;
  var page=(location.pathname.split('/').pop()||'index.html').toLowerCase();
  nav.querySelectorAll('a').forEach(function(a){
    var href=(a.getAttribute('href')||'').split('?')[0].toLowerCase();
    if(href===page && (a.getAttribute('href')||'').indexOf('?')<0) a.classList.add('cur');
  });
  try{
    var s=JSON.parse(localStorage.getItem('ops_session')||'null');
    var tok=s&&s.access_token,email='';
    if(tok){ try{ email=JSON.parse(atob(tok.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).email||''; }catch(e){} }
    if(email==='411249585@qq.com'){
      nav.querySelectorAll('[data-sx="admin"]').forEach(function(a){ a.hidden=false; });
    }
    var me=document.getElementById('sxMe');
    if(me && email){
      me.innerHTML='<span class="sx-name"></span> <span class="sx-email"></span>';
      me.querySelector('.sx-email').textContent=email;
      setTimeout(function(){
        var K=(typeof SB_KEY!=='undefined')?SB_KEY:((typeof ANON_KEY!=='undefined')?ANON_KEY:'');
        if(!K) return;
        fetch('https://fgrjdaizgjpqdimgtxrp.supabase.co/rest/v1/operators?select=name&email=eq.'+encodeURIComponent(email),
          {headers:{apikey:K,Authorization:'Bearer '+tok}})
          .then(function(r){ return r.ok?r.json():[]; })
          .then(function(rows){ var n=(rows&&rows[0]&&rows[0].name)||''; if(n) me.querySelector('.sx-name').textContent=n+' \u00b7 '; })
          .catch(function(){});
      }, 0);
      var out=document.createElement('a'); out.href='#'; out.className='sx-out'; out.textContent='\u9000\u51fa';
      out.onclick=function(ev){ ev.preventDefault(); localStorage.removeItem('ops_session'); location.reload(); };
      me.appendChild(out);
    }
  }catch(e){}
})();
</script>
<div class="wrap">

  <div class="hero">
    <h1>书荀互联网运营工作区</h1>
    <div class="sub">首页建设中 · 各业务入口见上方导航</div>
  </div>

</div>

</body>
</html>
