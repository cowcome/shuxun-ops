<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>书荀后台 · 稳定性与速度测试</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#f4f6fa;color:#1f2330;font-size:14px;line-height:1.6;
       font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       padding:16px 12px 60px}
  .wrap{max-width:820px;margin:0 auto}
  h1{font-size:19px;margin:0 0 6px}
  .sub{font-size:13px;color:#6b7280;margin-bottom:14px}
  .card{background:#fff;border:1px solid #e5e8ef;border-radius:14px;padding:16px;margin-bottom:12px}
  .btn{width:100%;height:48px;border:0;border-radius:12px;background:#0a84ff;color:#fff;
       font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:disabled{opacity:.55;cursor:default}
  .btn2{height:40px;border:1px solid #d6d9e2;background:#fff;color:#1f2330;border-radius:10px;
        padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit}
  .hint{font-size:12.5px;color:#6b7280;margin-top:10px}
  .tgt{margin-bottom:14px}
  .tgt:last-child{margin-bottom:0}
  .tname{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .thint{font-size:12px;color:#8a8f9e;font-weight:400}
  .seq{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
  .sq{width:17px;height:17px;border-radius:4px;background:#e9ecf2}
  .sq.ok{background:#10b981}
  .sq.bad{background:#ef4444}
  .sq.run{background:#fbbf24}
  .stat{font-size:12.5px;color:#4b5563;margin-top:5px;font-variant-numeric:tabular-nums}
  .b-ok{color:#0f7a52;font-weight:700}
  .b-bad{color:#c0392b;font-weight:700}
  .b-warn{color:#b45309;font-weight:700}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-size:12px;color:#6b7280;font-weight:600;padding:7px 8px;
     border-bottom:1px solid #e5e8ef;white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid #f1f3f7;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  .verdict{border-radius:12px;padding:14px;font-size:14px;line-height:1.7}
  .v-ok{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46}
  .v-bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
  .v-warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e}
  pre{background:#0f172a;color:#cbd5e1;font-size:12px;line-height:1.55;padding:12px;
      border-radius:10px;overflow:auto;max-height:300px;margin:10px 0 0;
      font-family:ui-monospace,Menlo,Consolas,monospace}
  .hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1>稳定性与速度测试</h1>
  <div class="sub">连打多次，分四路验证：普通请求 / 带密钥头的请求 / 登录请求 / 对照站。用来判断卡在哪一层。</div>

  <div class="card">
    <button class="btn" id="go" onclick="runAll()">开 始 测 试（约 15 秒）</button>
    <div class="hint">请在「登不上」的那台设备、用「登不上」的那个浏览器打开。不用改任何设置。</div>
  </div>

  <div class="card hide" id="progCard">
    <div id="prog" style="font-size:13px;color:#4b5563">准备中…</div>
  </div>

  <div class="card hide" id="listCard">
    <div id="list"></div>
  </div>

  <div class="card hide" id="verdictCard">
    <div id="verdict"></div>
  </div>

  <div class="card hide" id="tblCard">
    <div style="font-size:13px;font-weight:700;margin-bottom:8px">耗时明细（毫秒）</div>
    <div id="tbl"></div>
  </div>

  <div class="card hide" id="dumpCard">
    <button class="btn2" onclick="copyAll()" id="copyBtn">复制全部结果</button>
    <pre id="dump"></pre>
  </div>
</div>

<script>
var TIMEOUT = 8000;
var KEY = 'sb_publishable_PddH-hdBtn_G2vwtdB9xuA_UuBSLVgG';
var BASE = 'https://fgrjdaizgjpqdimgtxrp.supabase.co';

/* 五个目标：A 是「不触发跨域预检」的对照组，B/C 是「触发预检」的嫌疑项，
   D 是本站对照，E 是标定项（它必然失败，用来证明 Failed to fetch 不等于断网） */
var TARGETS = [
  { key:'a', name:'A · 数据库 普通请求', hint:'不带自定义头 → 不触发跨域预检（对照组，应该通）',
    runs:15, url: BASE + '/auth/v1/health', opts:{ cache:'no-store' } },
  { key:'b', name:'B · 数据库 带密钥头的查询', hint:'带 apikey 头 → 会先发 OPTIONS 预检（嫌疑项）',
    runs:10, url: BASE + '/rest/v1/stores?select=id&limit=1',
    opts:{ cache:'no-store', headers:{ 'apikey': KEY } } },
  { key:'c', name:'C · 数据库 登录请求', hint:'后台真实登录用的 POST+JSON → 会先发 OPTIONS 预检（嫌疑项）',
    runs:6, url: BASE + '/auth/v1/token?grant_type=password',
    opts:{ method:'POST', cache:'no-store',
           headers:{ 'apikey': KEY, 'Content-Type':'application/json' },
           body: JSON.stringify({ email:'probe-not-real@example.com', password:'probe-not-real' }) } },
  { key:'d', name:'D · 本站 GitHub Pages', hint:'对照组，应通',
    runs:10, url:'https://cowcome.github.io/shuxun-ops/version.json', opts:{ cache:'no-store' } },
  { key:'e', name:'E · 百度（标定项）', hint:'必然失败，用来证明「Failed to fetch」不代表网络断',
    runs:5, calib:true, url:'https://www.baidu.com/favicon.ico', opts:{ cache:'no-store' } }
];

var DATA = {};
var LINES = [];

function $(id){ return document.getElementById(id); }
function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function log(t){ LINES.push(t); }
function stamp(){ var d=new Date(); function p(n){return n<10?'0'+n:''+n;}
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds()); }

/* 单次探测：成功/失败 + 耗时 + 错误文案 */
function probe(t){
  var o = {};
  var src = t.opts || {};
  for(var k in src) o[k] = src[k];
  o.signal = ('AbortController' in window) ? undefined : undefined;
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  if(ctl) o.signal = ctl.signal;
  var timer = null;
  var url = t.url + (t.url.indexOf('?')>=0?'&':'?') + '_t=' + Math.random().toString(36).slice(2);
  var t0 = nowMs();
  var p;
  try { p = fetch(url, o); }
  catch(e){ return Promise.resolve({ ok:false, status:0, ms:0, err:(e&&e.message)||String(e) }); }
  if(ctl) timer = setTimeout(function(){ try{ ctl.abort(); }catch(e){} }, TIMEOUT);
  return p.then(function(r){
    if(timer) clearTimeout(timer);
    return { ok:true, status:r.status, ms:Math.round(nowMs()-t0), err:'' };
  }).catch(function(e){
    if(timer) clearTimeout(timer);
    var msg = (e && e.message) ? e.message : String(e);
    if(e && e.name === 'AbortError') msg = '超时 ' + (TIMEOUT/1000) + ' 秒无响应';
    return { ok:false, status:0, ms:Math.round(nowMs()-t0), err:msg };
  });
}

function renderSeq(t){
  var d = DATA[t.key];
  var h = '';
  for(var i=0;i<(t.runs||15);i++){
    var r = d.runs[i];
    var cls = !r ? '' : (r.ok ? 'ok' : 'bad');
    var tip = !r ? '未测' : (r.ok ? ('成功 ' + r.status + ' · ' + r.ms + 'ms') : ('失败 · ' + r.ms + 'ms · ' + r.err));
    h += '<div class="sq ' + cls + '" title="' + esc(tip) + '"></div>';
  }
  var done = d.runs.length; var TOT = t.runs||15;
  var okN = d.runs.filter(function(x){return x.ok;}).length;
  var badN = done - okN;
  var rate = done ? Math.round(okN / done * 100) : 0;
  var msArr = d.runs.filter(function(x){return x.ok;}).map(function(x){return x.ms;}).sort(function(a,b){return a-b;});
  var msTxt = '';
  if(msArr.length){
    var med = msArr[Math.floor(msArr.length/2)];
    msTxt = ' ｜ 成功耗时 中位 <b>' + med + 'ms</b>（' + msArr[0] + '~' + msArr[msArr.length-1] + '）';
  }
  return '<div class="tgt" id="tgt_' + t.key + '">' +
    '<div class="tname">' + esc(t.name) + ' <span class="thint">' + esc(t.hint) + '</span></div>' +
    '<div class="seq">' + h + '</div>' +
    '<div class="stat">' + (done ? ('已测 ' + done + '/' + TOT + ' ｜ 成功 <span class="' + (badN?'b-warn':'b-ok') + '">' + okN + '</span> · 失败 <span class="' + (badN?'b-bad':'') + '">' + badN + '</span> ｜ 成功率 <b>' + rate + '%</b>' + msTxt) : '等待测试…') + '</div>' +
  '</div>';
}

function renderList(){
  var h = '';
  TARGETS.forEach(function(t){ h += renderSeq(t); });
  $('list').innerHTML = h;
}

/* 逐目标、逐次串行执行（串行才测得准） */
function runTarget(idx){
  if(idx >= TARGETS.length) return Promise.resolve();
  var t = TARGETS[idx];
  var TOT = t.runs || 15;
  if(!DATA[t.key]) DATA[t.key] = { runs: [] };
  var i = 0;
  function step(){
    if(i >= TOT) return Promise.resolve();
    $('prog').textContent = '正在测：' + t.name + '（第 ' + (i+1) + '/' + TOT + ' 次）';
    return probe(t).then(function(r){
      DATA[t.key].runs.push(r);
      i++;
      renderList();
      log('[' + t.name + '] #' + i + ' ' + (r.ok ? ('OK ' + r.status) : 'FAIL ' + r.err) + ' · ' + r.ms + 'ms');
      return step();
    });
  }
  return step().then(function(){ return runTarget(idx+1); });
}

function median(a){
  if(!a.length) return 0;
  var b = a.slice().sort(function(x,y){return x-y;});
  return b[Math.floor(b.length/2)];
}

function verdict(){
  var el = $('verdict');
  function arr(k){ return DATA[k].runs; }
  function rate(k){ var a = arr(k); if(!a.length) return 0; return a.filter(function(x){return x.ok;}).length / a.length; }
  function oks(k){ return arr(k).filter(function(x){return x.ok;}); }
  function med(k){ return median(oks(k).map(function(x){return x.ms;})); }
  function bad(k){ return arr(k).length - oks(k).length; }
  function errs(k){
    var m = {};
    arr(k).filter(function(x){return !x.ok;}).forEach(function(x){ var t=x.err||'未知'; m[t]=(m[t]||0)+1; });
    return Object.keys(m).map(function(t){ return t + ' ×' + m[t]; }).join('；');
  }
  var rA=rate('a'), rB=rate('b'), rC=rate('c'), rD=rate('d'), rE=rate('e');
  var mA=med('a'), mB=med('b'), mC=med('c'), mD=med('d');
  var h = '';

  if(rD === 0){
    h = '<div class="verdict v-warn"><b>连本站页面都打不开</b>，说明这台设备此刻整体出不了网（或 GitHub Pages 被拦）。<br>先解决网络，再看后台。</div>';
  } else if(rA === 1 && rB === 1 && rC === 1){
    h = '<div class="verdict v-ok"><b>三项数据库请求全部通过（普通请求 / 带密钥头 / 登录 POST），跨域预检没有被拦。</b><br>' +
        '· 普通请求中位 <b>' + mA + 'ms</b> ｜ 带密钥头 <b>' + mB + 'ms</b> ｜ 登录 POST <b>' + mC + 'ms</b><br>' +
        '也就是说：<b>网络、跨域、登录通道全部正常</b>。后台登不上或很慢，原因在别处（浏览器缓存、旧会话、密码、或前端逻辑）。<br>' +
        '下一步该查浏览器侧：清掉站点数据后重登，或换个账号试。</div>';
  } else if(rA === 1 && (rB < 1 || rC < 1)){
    h = '<div class="verdict v-bad"><b>抓到了：不带头的请求能通，带头的请求被拦。</b><br>' +
        '· A 普通请求：<b>' + Math.round(rA*100) + '%</b>（' + arr('a').length + ' 次）<br>' +
        '· B 带密钥头：<b>' + Math.round(rB*100) + '%</b>' + (bad('b')?('（失败 ' + bad('b') + ' 次：' + esc(errs('b')) + '）'):'') + '<br>' +
        '· C 登录 POST：<b>' + Math.round(rC*100) + '%</b>' + (bad('c')?('（失败 ' + bad('c') + ' 次：' + esc(errs('c')) + '）'):'') + '<br>' +
        '<b>结论：网络在拦「跨域预检请求（OPTIONS）」，只放行最普通的 GET。</b><br>' +
        '这正好解释：诊断页能通、后台登录报 Failed to fetch、换个浏览器有时又行（浏览器会缓存预检结果）。<br>' +
        '<b>这条路要这么解</b>：让自有域名的反代直接在边缘应答预检、不转到 Supabase —— 换域名依然有效，但必须把预检一起接管。</div>';
  } else if(rA < 1 && rD === 1){
    h = '<div class="verdict v-bad"><b>数据库整体不通</b>（A 只有 ' + Math.round(rA*100) + '%），而本站正常。<br>' +
        (bad('a') ? ('失败原因：' + esc(errs('a')) + '<br>') : '') +
        '这是域名或链路层的问题：换自有域名能绕开；临时用手机热点。</div>';
  } else {
    h = '<div class="verdict v-warn"><b>结果不稳定，需要再看一眼。</b><br>' +
        '· A 普通请求 ' + Math.round(rA*100) + '% ｜ B 带头 ' + Math.round(rB*100) + '% ｜ C 登录 ' + Math.round(rC*100) + '% ｜ D 本站 ' + Math.round(rD*100) + '%<br>' +
        '请再跑一次，把两次结果一起发我。</div>';
  }

  /* E 标定项的解释：正常情况下它一定失败 */
  if(rE === 1){
    h += '<div class="verdict v-warn" style="margin-top:12px;font-size:13px">' +
         '<b>注意：E（百度）这次居然 ' + Math.round(rE*100) + '% 成功了，这在正常浏览器里不该发生。</b><br>' +
         '说明这个浏览器上装了会改写请求的东西（代理类插件、安全软件、或企业管控客户端）。' +
         '这类插件的状态会变，正是「今天这个浏览器行、明天换个才行」的常见原因 —— 先把它找出来关掉再看。</div>';
  } else {
    h += '<div class="verdict v-warn" style="margin-top:12px;font-size:13px">' +
         '<b>关于 E（百度）：它 ' + Math.round(rE*100) + '% 是正常的，不是故障。</b><br>' +
         '百度不返回跨域许可头，浏览器一定拒绝读取，所以任何电脑都会失败。' +
         '它留在这里是为了标定一件事：<b>「Failed to fetch」不代表网断了</b>，也可能是被浏览器在跨域检查这一关拦下。</div>';
  }

  if(mA >= 800){
    h += '<div class="verdict v-warn" style="margin-top:12px;font-size:13px"><b>另外：能通，但慢。</b>' +
         '数据库普通请求中位 <b>' + mA + 'ms</b>' + (mD ? ('，是本站（' + mD + 'ms）的 ' + Math.round(mA/mD) + ' 倍') : '') +
         '。后台一次加载要发十几次请求，这部分乘起来就是好几秒 —— 这是「慢」的另一半原因，和拦截无关。</div>';
  }

  h += '<div style="margin-top:12px;font-size:12.5px;color:#6b7280">说明：每次请求都带随机参数、禁用缓存，是真发起新连接。C 用的是假账号，只会被服务器拒绝、不会产生任何数据。</div>';
  el.innerHTML = h;
}

function table(){
  var h = '<table><thead><tr><th>目标</th><th>成功</th><th>成功率</th><th>中位</th><th>最快</th><th>最慢</th></tr></thead><tbody>';
  TARGETS.forEach(function(t){
    var d = DATA[t.key].runs;
    var ok = d.filter(function(x){return x.ok;});
    var ms = ok.map(function(x){return x.ms;}).sort(function(a,b){return a-b;});
    var rate = d.length ? Math.round(ok.length/d.length*100) : 0;
    h += '<tr><td>' + esc(t.name) + '</td>' +
      '<td>' + ok.length + '/' + d.length + '</td>' +
      '<td class="' + (rate===100?'b-ok':(rate>=60?'b-warn':'b-bad')) + '">' + rate + '%</td>' +
      '<td>' + (ms.length?median(ms):'—') + '</td>' +
      '<td>' + (ms.length?ms[0]:'—') + '</td>' +
      '<td>' + (ms.length?ms[ms.length-1]:'—') + '</td></tr>';
  });
  h += '</tbody></table>';
  $('tbl').innerHTML = h;
}

function copyAll(){
  var txt = LINES.join('\n');
  var ta = document.createElement('textarea');
  ta.value = txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); $('copyBtn').textContent = '已复制 ✓'; }
  catch(e){ $('copyBtn').textContent = '复制失败，请手动选中'; }
  setTimeout(function(){ document.body.removeChild(ta); $('copyBtn').textContent = '复制全部结果'; }, 1600);
}

function sysInfo(){
  var ua = navigator.userAgent;
  var br = /Edg\//.test(ua) ? 'Edge' : (/Chrome\//.test(ua) && !/Edg\//.test(ua) ? 'Chrome' : (/Firefox\//.test(ua) ? 'Firefox' : (/Safari\//.test(ua) ? 'Safari' : '其他')));
  log('# 书荀后台 · 稳定性与速度测试');
  log('时间: ' + stamp());
  log('浏览器: ' + br + ' ｜ 在线: ' + (navigator.onLine ? 'yes' : 'no'));
  log('UA: ' + ua);
  log('每目标 5~15 次（见下），超时 ' + (TIMEOUT/1000) + ' 秒，禁用缓存');
  log('');
}

function runAll(){
  var btn = $('go');
  btn.disabled = true; btn.textContent = '测 试 中…';
  DATA = {}; LINES = [];
  TARGETS.forEach(function(t){ DATA[t.key] = { runs: [] }; });
  $('progCard').classList.remove('hide');
  $('listCard').classList.remove('hide');
  $('tblCard').classList.remove('hide');
  $('verdictCard').classList.remove('hide');
  $('dumpCard').classList.remove('hide');
  $('list').innerHTML = ''; $('tbl').innerHTML = ''; $('verdict').innerHTML = '';
  sysInfo();
  renderList();
  runTarget(0).then(function(){
    $('prog').textContent = '测试完成 ✓';
    verdict();
    table();
    $('dump').textContent = LINES.join('\n');
    btn.disabled = false; btn.textContent = '再 测 一 次';
    log('');
    log('=== 结果汇总 ===');
    TARGETS.forEach(function(t){
      var d = DATA[t.key].runs;
      var ok = d.filter(function(x){return x.ok;}).length;
      var ms = d.filter(function(x){return x.ok;}).map(function(x){return x.ms;});
      log(t.name + ': 成功 ' + ok + '/' + d.length + (ms.length ? (' · 中位 ' + median(ms) + 'ms') : ''));
    });
  });
}
</script>
</body>
</html>
