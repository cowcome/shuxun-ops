<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>书荀互联网业绩数据明细</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{padding:0 40px 64px}
.hero{padding:24px 0 10px}
.hero h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.hero .sub{color:#6e6e73;font-size:13px;margin-top:6px}
section{margin-top:22px}
h2{font-size:18px;font-weight:700;margin-bottom:10px;letter-spacing:-.2px}
.badge{font-size:11px;font-weight:600;color:#0a84ff;background:rgba(10,132,255,.1);border-radius:20px;padding:3px 10px;margin-left:8px;vertical-align:2px}
/* 筛选区：吸顶单行 */
.filters{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.92);backdrop-filter:blur(12px);border-bottom:1px solid #e5e5ea;padding:12px 40px;margin:14px -40px 0}
.filters .frow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;row-gap:10px}
.fitem{display:flex;align-items:center;gap:6px;flex-shrink:0}
.fitem label{font-size:11px;color:#6e6e73;font-weight:600;white-space:nowrap}
.fitem input,.fitem select{font-size:13px;padding:7px 10px;border-radius:10px;border:1px solid #d8dbe3;background:#fff;color:#1d1d1f;font-weight:600}
.fitem input[type="date"]{width:118px}
.fitem select{min-width:110px}
.quick{display:flex;gap:5px;flex-wrap:nowrap;flex-shrink:0}
.quick button{font-size:12px;padding:7px 11px;border-radius:10px;border:1px solid #d8dbe3;background:#fff;color:#1d1d1f;font-weight:600;cursor:pointer;white-space:nowrap}
.quick button.on{background:#0a84ff;border-color:#0a84ff;color:#fff}
/* 开关 */
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
.switch input{display:none}
.switch i{position:relative;width:42px;height:24px;border-radius:12px;background:#d8dbe3;transition:background .2s;flex-shrink:0}
.switch i::after{content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.switch input:checked+i{background:#0a84ff}
.switch input:checked+i::after{left:20px}
/* 查询按钮已移除（改选择即刷新） */
/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.kpi{background:#fff;border-radius:16px;padding:14px 16px}
.kpi-l{font-size:12px;color:#6e6e73}
.kpi-v{font-size:22px;font-weight:700;margin-top:2px;letter-spacing:-.4px}
.kpi-s{font-size:12px;margin-top:3px;color:#6e6e73}
/* 平台结构：分段占比药丸 */
.pfcard{background:#fff;border-radius:16px;padding:18px 20px}
.pfpill{display:flex;height:24px;border-radius:999px;overflow:hidden;background:#eef0f4}
.pfpill > i{display:block;height:100%}
.pfpill .dy{background:#7c5cff}
.pfpill .mt{background:#f97316}
.pflegend{display:flex;gap:22px;margin-top:14px;flex-wrap:wrap}
.pflegend .lg{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.pflegend .dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.pflegend .amt{color:#1d1d1f}
.pflegend .pct{color:#6e6e73;font-weight:700}
/* 运营人条形 */
.opcard{background:#fff;border-radius:16px;padding:16px 18px}
.oprow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.oprow .nm{width:64px;flex-shrink:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opbar{flex:1;height:18px;background:#eef0f4;border-radius:9px;overflow:hidden}
.opbar > i{display:block;height:100%;background:#0a84ff;border-radius:9px}
.oprow .val{flex:0 0 auto;text-align:right;font-weight:600}
.oprow .sub{flex:0 0 auto;text-align:right;color:#6e6e73;font-size:11px}
/* 门店排名 */
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
th{font-size:13px;color:#1d1d1f;font-weight:700;text-align:left;padding:11px 14px;border-bottom:1px solid #d8dbe3;white-space:nowrap;background:#f7f8fa}
td{padding:11px 14px;border-bottom:1px solid #f2f2f4;white-space:nowrap}
tr:last-child td{border-bottom:none}
td:first-child{font-weight:600}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:8px;margin-left:6px;vertical-align:1px;cursor:pointer}
.tag-stop{background:#fff0e6;color:#e8730a}      /* 停业 */
.tag-train{background:#ede7ff;color:#6d3bdb}     /* 培训/装修 */
.tag-new{background:#e7f7ec;color:#1a9e4b}       /* 新店未足月 */
.plabel{display:inline-block;margin-left:auto;font-size:13px;font-weight:700;color:#1d4ed8;white-space:nowrap;align-self:center}
.refmini{display:block;font-size:11px;color:#dc2626;font-weight:600;margin-top:2px}
td.ref{color:#dc2626;font-weight:700}
.sptip{position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);background:#1f2330;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.sptip.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{margin:14px 0 0;background:#fff8e6;border:1px solid #ffe2a8;color:#9a6b00;border-radius:12px;padding:12px 16px;font-size:13px;font-weight:600}
.note{font-size:12px;color:#6e6e73;margin-top:8px;padding:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.warnbox{background:#fff;border-radius:16px;padding:4px 16px;margin-top:10px}
.warn{padding:12px 0;border-bottom:1px solid #f0f0f2;font-size:13.5px}
.warn:last-child{border:none}
.empty{color:#8a8a8e;font-size:13px;background:#fff;border-radius:14px;padding:14px 16px}
/* 业绩日历 */
.cal-month{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.cal-title{font-size:14px;font-weight:700;margin-bottom:10px;color:#1d1d1f}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-grid.cal-head span{font-size:11px;color:#8a8f9e;text-align:center;padding:2px 0}
.cal-cell{aspect-ratio:1/.9;border-radius:10px;background:#f4f5f8;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#1d1d1f;position:relative;overflow:hidden}
.cal-cell b{font-weight:700;font-size:13px}
.cal-cell i{font-style:normal;font-size:10px;margin-top:1px;opacity:.9;white-space:nowrap}
.cal-cell.empty{background:transparent}
.cal-cell.out{opacity:.32}
.cal-cell.gap{border:2px solid #ef4444;color:#ef4444;background:#fff5f5}
.cal-cell.gap i{color:#ef4444}
.cal-cell.today{box-shadow:0 0 0 2px #0a84ff inset}
.loadbox{text-align:center;padding:80px 20px;color:#6e6e73;font-size:14px}
.loadbox .spin{display:inline-block;width:26px;height:26px;border:3px solid #e5e5ea;border-top-color:#0a84ff;border-radius:50%;animation:sp 1s linear infinite;margin-bottom:14px}
@keyframes sp{to{transform:rotate(360deg)}}
.errbox{background:#fff5f5;border:1px solid #ffd6d6;color:#c0392b;border-radius:14px;padding:16px;font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>书荀互联网业绩数据明细</h1>
    <div class="sub">按时间段 / 运营人 / 平台 / 类型 灵活筛选 · 连锁业绩=核销+验券+记账核销；直营=抖音/美团净核销（已扣内购）；均不含内购上翻</div>
  </div>

  <section class="filters">
    <div class="frow">
      <div class="quick" id="quick">
        <button data-q="7">近7天</button>
        <button data-q="30">近30天</button>
        <button data-q="mtd">本月</button>
        <button data-q="pm">上月</button>
      </div>
      <div class="fitem"><input type="date" id="dStart"></div>
      <div class="fitem"><input type="date" id="dEnd"></div>
      <div class="fitem"><select id="opSel"><option value="">全部运营人</option></select></div>
      <div class="fitem"><select id="pfSel"><option value="">全部平台</option><option value="抖音">抖音</option><option value="美团">美团</option></select></div>
      <div class="fitem"><select id="typeSel"><option value="">全部类型</option><option value="连锁">连锁</option><option value="直营">直营</option></select></div>
      <span id="periodLabel" class="plabel"></span>
    </div>
  </section>

  <div id="out">
    <div class="loadbox"><div class="spin"></div><br>正在加载数据…</div>
  </div>
</div>

<script>
const SB_URL='https://fgrjdaizgjpqdimgtxrp.supabase.co';
const SB_KEY='sb_publishable_PddH-hdBtn_G2vwtdB9xuA_UuBSLVgG';
const UP='#34c759',DN='#ff3b30',MUT='#6e6e73';
let session=null;
try{ session=JSON.parse(localStorage.getItem('ops_session')||'null'); }catch(e){}
async function authPost(path,body){
  const r=await fetch(SB_URL+path,{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error_description||d.msg||d.message||('HTTP '+r.status));
  return d;
}
async function ensureSession(){
  if(!session) throw new Error('未登录，请先从运营后台登录');
  const exp=session.expires_at||0;
  if(exp*1000-Date.now()<120000){
    const d=await authPost('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token});
    session=d; localStorage.setItem('ops_session',JSON.stringify(d));
  }
  return session;
}
async function sb(path,opts){
  opts=opts||{};
  await ensureSession();
  const h=Object.assign({'apikey':SB_KEY,'Authorization':'Bearer '+session.access_token,'Content-Type':'application/json'},opts.headers||{});
  let r=await fetch(SB_URL+path,Object.assign({},opts,{headers:h}));
  if(r.status===401){
    const d=await authPost('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token});
    session=d; localStorage.setItem('ops_session',JSON.stringify(d));
    h['Authorization']='Bearer '+session.access_token;
    r=await fetch(SB_URL+path,Object.assign({},opts,{headers:h}));
  }
  return r;
}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function addD(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
/* 🔴 结束日必须「小于 次日」而不是「小于等于 结束日」：
   库里 done_time 是 text 且带时分秒（如 2026-10-09 23:30:00），
   用 lte.'2026-10-09' 走的是文本比较 → '2026-10-09 23:30:00' > '2026-10-09'
   → 结束日当天整批被排除（10-10 修复：当天导入的数据查不到） */
function endNextDay(end){ return iso(addD(new Date(end+'T00:00:00'),1)); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(x){
  if(x==null||isNaN(x)) return '¥0';
  if(Math.abs(x)>=10000) return '¥'+(x/10000).toFixed(Math.abs(x)>=100000?1:2)+'万';
  return '¥'+Math.round(x);
}
const $=(id)=>document.getElementById(id);

let ALL_ORDERS=[], ALL_STORES=[], OP_MAP={}, SPECIAL=[], ALL_REFUNDS=[], pctCell=(a,b)=> b?Math.round(a/b*100):0;

async function loadData(start,end){
  const endX=endNextDay(end);   // 结束日+1 天，用 lt 比较（见 endNextDay 注释）
  ALL_ORDERS=[]; let off=0;
  while(true){
    const r=await sb('/rest/v1/chain_verify_orders?select=store_id,platform,biz,amount,done_time&done_time=gte.'+start+'&done_time=lt.'+endX+'&order=done_time.asc',{headers:{'Range':off+'-'+(off+999)}});
    if(!r.ok) throw new Error('订单拉取失败 HTTP '+r.status);
    const b=await r.json();
    b.forEach(o=>o.type='连锁');
    ALL_ORDERS=ALL_ORDERS.concat(b);
    if(b.length<1000) break;
    off+=1000;
  }
  // 佛山直营：daily_reports（按门店名+日期每日填报，金额已扣内购）
  let doff=0, daily=[];
  while(true){
    const r=await sb('/rest/v1/daily_reports?select=store_name,form_date,meituan_verify_amount,douyin_verify_amount,meituan_visitors,douyin_visitors&form_date=gte.'+start+'&form_date=lt.'+endX+'&order=form_date.asc',{headers:{'Range':doff+'-'+(doff+999)}});
    if(!r.ok) throw new Error('直营日报拉取失败 HTTP '+r.status);
    const b=await r.json();
    daily=daily.concat(b);
    if(b.length<1000) break;
    doff+=1000;
  }
  const rs=await sb('/rest/v1/stores?select=id,std_name,status,store_type,operator,city&order=id.asc');
  if(!rs.ok) throw new Error('门店表拉取失败 HTTP '+rs.status);
  ALL_STORES=await rs.json();
  const nameMap={}; ALL_STORES.forEach(s=>{ nameMap[(s.std_name||'').trim()]=s; });
  daily.forEach(r=>{
    const st=nameMap[(r.store_name||'').trim()];
    const sid=st?st.id:null;
    const mt=Number(r.meituan_verify_amount)||0, dy=Number(r.douyin_verify_amount)||0;
    if(mt>0) ALL_ORDERS.push({store_id:sid,platform:'美团',biz:'核销',amount:mt,done_time:r.form_date+'T00:00:00',type:'直营',visitors:Number(r.meituan_visitors)||0,_name:r.store_name});
    if(dy>0) ALL_ORDERS.push({store_id:sid,platform:'抖音',biz:'核销',amount:dy,done_time:r.form_date+'T00:00:00',type:'直营',visitors:Number(r.douyin_visitors)||0,_name:r.store_name});
  });
  OP_MAP={}; STATUS_MAP={};
  ALL_STORES.forEach(s=>{ OP_MAP[s.id]=(s.operator||'').trim(); STATUS_MAP[s.id]=(s.status||'').trim(); });
  const ops=[...new Set(ALL_STORES.map(s=>(s.operator||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh'));
  const sel=$('opSel');
  sel.innerHTML='<option value="">全部运营人</option>'+ops.map(o=>'<option value="'+esc(o)+'">'+esc(o)+'</option>').join('');
  // 退款明细（按扣减日 done_date 区间过滤；仅影响连锁；store_id 为空表示未挂接门店）
  const rf=await sb('/rest/v1/chain_refund_orders?select=store_id,platform,biz,amount,done_date&done_date=gte.'+start+'&done_date=lt.'+endX+'&order=done_date.asc');
  ALL_REFUNDS = rf.ok ? await rf.json() : [];
  // 特殊营业周期（用于实际营业天数 + 门店标记）
  const sp=await sb('/rest/v1/store_special_periods?select=store_id,special_type,start_date,end_date');
  SPECIAL = sp.ok ? await sp.json() : [];
}

function overlapDays(r,start,end){
  const rs=new Date(Math.max(new Date(r.start_date),new Date(start)));
  const re=new Date(Math.min(new Date(r.end_date||end),new Date(end)));
  return (rs<=re)? ((re-rs)/86400000+1) : 0;
}
function spTag(r,days){
  if(days<=0) return '';
  const type=r.special_type||'';
  const cls=(type==='停业'||type==='闭店')?'tag-stop':(type==='新店'||type==='未足月')?'tag-new':'tag-train';
  const tip=esc(type)+(r.start_date?('：'+r.start_date+' ~ '+(r.end_date||'未填结束日')):'')+(days>0?('（'+days+'天）'):'');
  return '<span class="tag '+cls+'" data-tip="'+tip+'" onclick="sxSpTip(this)">'+esc(type)+(days>0?days+'天':'')+'</span>';
}
function sxSpTip(el){
  let t=$('sptip');
  if(!t){ t=document.createElement('div'); t.id='sptip'; t.className='sptip'; document.body.appendChild(t); }
  t.textContent=el.getAttribute('data-tip')||'';
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm=setTimeout(function(){ t.classList.remove('show'); }, 3000);
}
function applyFilter(start,end){
  const op=$('opSel').value, pf=$('pfSel').value, tp=$('typeSel').value;
  const byStore={}, byOp={}, byPf={抖音:{amt:0},美团:{amt:0}};
  let totalAmt=0, totalCnt=0, totalVis=0, chainAmt=0, directAmt=0; const allDays=new Set();
  const daily={}, dailyRef={};
  const NAT=(new Date(end)-new Date(start))/86400000+1;
  function bizDaysOf(sid){
    if(sid==null||sid==='null') return null;
    let sp=0;
    SPECIAL.filter(r=>String(r.store_id)===String(sid)).forEach(r=>{ sp+=overlapDays(r,start,end); });
    return Math.max(0,NAT-sp);
  }
  for(const o of ALL_ORDERS){
    if(tp && o.type!==tp) continue;
    const opn=OP_MAP[o.store_id]||'';
    if(op && opn!==op) continue;
    if(pf && o.platform!==pf) continue;
    const amt=Number(o.amount)||0;
    totalAmt+=amt;
    if(o.type==='连锁'){ totalCnt++; chainAmt+=amt; }
    else { totalVis+=(o.visitors||0); directAmt+=amt; }
    const dk=o.done_time.slice(0,10); allDays.add(dk);
    if(!byStore[o.store_id]) byStore[o.store_id]={amt:0,cnt:0,vis:0,type:o.type,name:o._name||'',days:new Set()};
    byStore[o.store_id].amt+=amt;
    if(o.type==='连锁') byStore[o.store_id].cnt++; else byStore[o.store_id].vis+=(o.visitors||0);
    byStore[o.store_id].days.add(dk);
    if(!byOp[opn]) byOp[opn]={amt:0,n:0};
    byOp[opn].amt+=amt;
    if(byPf[o.platform]){ byPf[o.platform].amt+=amt; }
    if(!daily[dk]) daily[dk]={amt:0,cnt:0,vis:0};
    daily[dk].amt+=amt;
    if(o.type==='连锁') daily[dk].cnt++; else daily[dk].vis+=(o.visitors||0);
  }
  const storeSet=new Set(Object.keys(byStore).filter(k=>k && k!=='null'));
  for(const s of ALL_STORES){ if(storeSet.has(String(s.id)) && OP_MAP[s.id]) byOp[OP_MAP[s.id]].n++; }
  const bDays=allDays.size||1;
  const chainStores=Object.keys(byStore).filter(k=>k&&k!=='null'&&byStore[k].type==='连锁').length;
  const directStores=Object.keys(byStore).filter(k=>byStore[k].type==='直营').length;
  // 退款扣减聚合（仅连锁；按 store_id + platform 对齐扣；金额与单数同步扣）
  const R={byStore:{}, byPf:{抖音:{amt:0,cnt:0},美团:{amt:0,cnt:0}}, amt:0, cnt:0};
  ALL_REFUNDS.forEach(r=>{
    const amt=Number(r.amount)||0;
    if(r.platform!=='抖音' && r.platform!=='美团') return;
    R.amt+=amt; R.cnt++;
    if(R.byPf[r.platform]){ R.byPf[r.platform].amt+=amt; R.byPf[r.platform].cnt++; }
    const sid=String(r.store_id==null?'':r.store_id);
    if(sid && sid!=='null'){ if(!R.byStore[sid]) R.byStore[sid]={amt:0,cnt:0}; R.byStore[sid].amt+=amt; R.byStore[sid].cnt++; }
    const dk=r.done_date; if(!dailyRef[dk]) dailyRef[dk]={amt:0,cnt:0}; dailyRef[dk].amt+=amt; dailyRef[dk].cnt++;
  });
  totalAmt-=R.amt; totalCnt-=R.cnt; chainAmt-=R.amt;
  byPf['抖音'].amt-=R.byPf['抖音'].amt; byPf['美团'].amt-=R.byPf['美团'].amt;
  totalAmt=Math.max(0,totalAmt); totalCnt=Math.max(0,totalCnt); chainAmt=Math.max(0,chainAmt);
  byPf['抖音'].amt=Math.max(0,byPf['抖音'].amt); byPf['美团'].amt=Math.max(0,byPf['美团'].amt);
  return {op,pf,tp,start,end,totalAmt,totalCnt,totalVis,chainAmt,directAmt,byStore,byOp,byPf,bDays,chainStores,directStores,bizDaysOf,refunds:R,daily,dailyRef};
}

function dayColor(t){
  t=Math.max(0,Math.min(1,t));
  let a,b,tt;
  if(t<0.5){ a=[255,243,176]; b=[74,222,128]; tt=t/0.5; }
  else { a=[74,222,128]; b=[59,130,246]; tt=(t-0.5)/0.5; }
  const c=a.map((v,i)=>Math.round(v+(b[i]-v)*tt));
  return 'rgb('+c[0]+','+c[1]+','+c[2]+')';
}
function fmtWan(v){
  if(v>=10000) return (v/10000).toFixed(1)+'万';
  return Math.round(v).toString();
}
function renderCalendar(d){
  const daily=d.daily||{}, dref=d.dailyRef||{};
  const net={}; let mn=Infinity, mx=-Infinity;
  Object.keys(daily).forEach(k=>{ const a=(daily[k].amt||0)-((dref[k]&&dref[k].amt)||0); net[k]=a; if(a>0){ if(a<mn)mn=a; if(a>mx)mx=a; } });
  if(mx<mn){ mn=0; mx=1; }
  const start=new Date(d.start), end=new Date(d.end);
  const today=new Date(); today.setHours(0,0,0,0);
  const months=[]; let m=new Date(start.getFullYear(),start.getMonth(),1); const last=new Date(end.getFullYear(),end.getMonth(),1);
  while(m<=last){ months.push(new Date(m)); m=new Date(m.getFullYear(),m.getMonth()+1,1); }
  let H='<section><h2>业绩日历<span class="badge">按日业绩 · 悬停看详情</span></h2>';
  H+='<div class="note" style="margin-bottom:12px">格子颜色：浅黄=业绩低 · 绿=居中 · 蓝=高（按当前周期分布）。<span style="color:#ef4444;font-weight:600">红框</span>=该日无业绩数据（疑似漏导入）。</div>';
  months.forEach(mo=>{
    const y=mo.getFullYear(), mm=mo.getMonth();
    const first=new Date(y,mm,1), daysInMo=new Date(y,mm+1,0).getDate();
    const lead=(first.getDay()+6)%7;
    H+='<div class="cal-month"><div class="cal-title">'+y+' 年 '+(mm+1)+' 月</div>';
    H+='<div class="cal-grid cal-head">'+['一','二','三','四','五','六','日'].map(w=>'<span>'+w+'</span>').join('')+'</div>';
    H+='<div class="cal-grid">';
    for(let i=0;i<lead;i++) H+='<span class="cal-cell empty"></span>';
    for(let day=1; day<=daysInMo; day++){
      const dt=new Date(y,mm,day); const dk=iso(dt);
      const inRange = dt>=start && dt<=end;
      const isPast = dt<today;
      const isToday = dt.getTime()===today.getTime();
      const hasData = daily[dk] && daily[dk].amt>0;
      let cls='cal-cell', bg='', tip='', txt='<b>'+day+'</b>';
      if(!inRange){ cls+=' out'; }
      else if(hasData){
        const netv=net[dk]; const t = mx>mn ? (netv-mn)/(mx-mn) : 0.5;
        bg=dayColor(t);
        const rec=daily[dk]; const cnt=(rec.cnt||0)-((dref[dk]&&dref[dk].cnt)||0); const vis=rec.vis||0;
        tip=dk+' ｜ 净业绩 ¥'+money(netv)+' ｜ 连锁 '+cnt+' 单 · 直营 '+vis+' 人';
        txt='<b>'+day+'</b><i>¥'+fmtWan(netv)+'</i>';
      } else if(isPast){ cls+=' gap'; tip=dk+' ｜ 无业绩数据（疑似漏导入）'; txt='<b>'+day+'</b><i>?</i>'; }
      if(isToday) cls+=' today';
      H+='<span class="'+cls+'" '+(bg?'style="background:'+bg+'" ':'')+(tip?'title="'+tip.replace(/"/g,'&quot;')+'" ':'')+'>'+txt+'</span>';
    }
    H+='</div></div>';
  });
  H+='</section>';
  return H;
}
function render(d){
  const out=$('out');
  let H='';
  const chainKPI = d.totalCnt? d.chainAmt/d.totalCnt : 0;
  const directKPI = d.totalVis? d.directAmt/d.totalVis : 0;
  const cN=d.chainStores, dN=d.directStores;
  /* KPI */
  H+='<section><div class="kgrid">'
    +'<div class="kpi"><div class="kpi-l">核销金额（净）</div><div class="kpi-v">'+money(d.totalAmt)+'</div><div class="kpi-s">营业 '+d.bDays+' 天 · 日均 '+money(d.totalAmt/d.bDays)+(d.refunds&&d.refunds.amt?' · 退款 '+d.refunds.cnt+' 笔 -'+money(d.refunds.amt):'')+'</div></div>'
    +'<div class="kpi"><div class="kpi-l">连锁核销单数</div><div class="kpi-v">'+d.totalCnt+' 单</div><div class="kpi-s">连锁客单 '+money(chainKPI)+'</div></div>'
    +'<div class="kpi"><div class="kpi-l">直营到店客数</div><div class="kpi-v">'+d.totalVis+' 人</div><div class="kpi-s">直营客单 '+money(directKPI)+'</div></div>'
    +'<div class="kpi"><div class="kpi-l">覆盖门店</div><div class="kpi-v">'+(cN+dN)+' 家</div><div class="kpi-s">连锁 '+cN+' · 直营 '+dN+(d.op?' · '+d.op:'')+(d.pf?' · '+d.pf:'')+(d.tp?' · '+d.tp:'')+'</div></div>'
    +'</div></section>';

  /* 双栏：平台结构 + 运营人对比 */
  H+='<section><div class="two">';
  const dyA=d.byPf['抖音'].amt, mtA=d.byPf['美团'].amt, pfTot=dyA+mtA||1;
  H+='<div><h2>平台结构<span class="badge">抖音 / 美团</span></h2><div class="pfcard">';
  const dyPct=dyA/pfTot*100, mtPct=mtA/pfTot*100;
  H+='<div class="pfpill"><i class="dy" style="width:'+dyPct.toFixed(1)+'%"></i><i class="mt" style="width:'+mtPct.toFixed(1)+'%"></i></div>';
  H+='<div class="pflegend">'
    +'<span class="lg"><i class="dot" style="background:#7c5cff"></i><span>抖音</span><span class="amt">'+money(dyA)+'</span><span class="pct">'+Math.round(dyPct)+'%</span></span>'
    +'<span class="lg"><i class="dot" style="background:#f97316"></i><span>美团</span><span class="amt">'+money(mtA)+'</span><span class="pct">'+Math.round(mtPct)+'%</span></span>'
    +'</div>';
  if(d.refunds && d.refunds.amt){ H+='<div class="refmini" style="margin-top:10px">已扣退款 '+d.refunds.cnt+' 笔 -'+money(d.refunds.amt)+'（按原订单完成日回溯）</div>'; }
  H+='</div></div>';

  /* 运营人对比（仅全部时显示） */
  if(!d.op){
    const ops=Object.keys(d.byOp).filter(k=>k && d.byOp[k].amt>0).sort((a,b)=>d.byOp[b].amt-d.byOp[a].amt);
    const maxA=ops.length?d.byOp[ops[0]].amt:1;
    H+='<div><h2>按运营人对比<span class="badge">'+ops.length+' 人</span></h2><div class="opcard">';
    if(ops.length){
      ops.forEach(k=>{
        const v=d.byOp[k];
        H+='<div class="oprow"><div class="nm" title="'+esc(k)+'">'+esc(k)+'</div><div class="opbar"><i style="width:'+(v.amt/maxA*100).toFixed(1)+'%"></i></div><div class="val">'+money(v.amt)+'</div><div class="sub">'+v.n+' 家店</div></div>';
      });
    }else{
      H+='<div class="empty">该区间暂无业绩数据</div>';
    }
    H+='</div></div>';
  }
  H+='</div></section>';

  /* 业绩日历（本月视图：按总业绩着色 + 悬停看详情 + 漏导入红框） */
  H+=renderCalendar(d);

  /* 门店排名（含实际营业天数 + 特殊营业标记） */
  const stores=Object.keys(d.byStore).map(id=>{
    const rec=d.byStore[id];
    const st = (id && id!=='null') ? (ALL_STORES.find(s=>String(s.id)===String(id))||{}) : {};
    const isChain=rec.type==='连锁';
    const biz = isChain ? d.bizDaysOf(id) : (rec.days?rec.days.size:0);
    const sp = (id && id!=='null') ? SPECIAL.filter(r=>String(r.store_id)===String(id) && overlapDays(r,d.start,d.end)>0) : [];
    const ref = (isChain && d.refunds && d.refunds.byStore[String(id)]) ? d.refunds.byStore[String(id)] : {amt:0,cnt:0};
    const netAmt=Math.max(0, rec.amt-ref.amt), netCnt=Math.max(0, rec.cnt-ref.cnt);
    return {id, std:(st.std_name||rec.name||('门店'+id)), op:OP_MAP[id]||'', type:rec.type, amt:netAmt, cnt:netCnt, vis:rec.vis, biz, sp, refAmt:ref.amt, refCnt:ref.cnt};
  }).sort((a,b)=>b.amt-a.amt);
  const spStores=stores.filter(s=>s.sp&&s.sp.length);
  if(spStores.length){
    H+='<div class="banner">⚠ 本区间有 '+spStores.length+' 家门店存在特殊营业（停业 / 培训 / 新店未满月等），其「日均」按各自营业天计算，已在门店表标注。</div>';
  }
  H+='<section><h2>门店业绩排名<span class="badge">'+stores.length+' 家</span></h2>';
  if(stores.length){
    H+='<table><thead><tr><th>门店</th><th>类型</th><th>运营人</th><th>核销金额</th><th>单数/客数</th><th>客单</th><th>营业天</th><th>日均</th><th>特殊营业</th></tr></thead><tbody>';
    stores.forEach(s=>{
      const isChain=s.type==='连锁';
      const unit=isChain?s.cnt+' 单':s.vis+' 人';
      const kpiAmt=isChain?(s.cnt? s.amt/s.cnt:0):(s.vis? s.amt/s.vis:0);
      const bz=(s.biz==null)?1:(s.biz||1);
      const spHtml=(s.sp&&s.sp.length)? s.sp.map(r=>spTag(r, overlapDays(r,d.start,d.end))).join('') : '—';
      H+='<tr><td>'+esc(s.std)+'</td><td>'+(isChain?'连锁':'直营')+'</td><td>'+esc(s.op)+'</td><td>'+money(s.amt)+(s.type==='连锁'&&s.refAmt?'<span class="refmini">退'+s.refCnt+'笔 -'+money(s.refAmt)+'</span>':'')+'</td><td>'+unit+'</td><td>'+money(kpiAmt)+'</td><td>'+(s.biz==null?'—':bz+' 天')+'</td><td>'+money(s.amt/bz)+'</td><td>'+spHtml+'</td></tr>';
    });
    H+='</tbody></table>';
  }else{
    H+='<div class="empty">该筛选条件下暂无业绩数据</div>';
  }
  H+='</section>';

  /* 退款明细板块 */
  if(d.refunds && d.refunds.amt>0){
    const rfs=ALL_REFUNDS.filter(r=>r.platform==='抖音'||r.platform==='美团').slice().sort((a,b)=> (a.done_date<b.done_date?1:-1));
    H+='<section><h2>退款明细<span class="badge">'+rfs.length+' 笔 · 已扣业绩</span></h2>';
    H+='<div class="note" style="margin-bottom:10px">以下退款已从对应门店 / 平台业绩中扣除（金额与单数同步扣），归属日按原订单完成日回溯。</div>';
    H+='<table><thead><tr><th>原订单完成日</th><th>门店</th><th>平台</th><th>退款金额</th><th>原因</th></tr></thead><tbody>';
    rfs.forEach(r=>{
      const st=ALL_STORES.find(s=>String(s.id)===String(r.store_id))||{};
      const nm=st.std_name||r.store_name||'未挂接门店';
      H+='<tr><td>'+esc(r.done_date)+'</td><td>'+esc(nm)+'</td><td>'+esc(r.platform)+'</td><td class="ref">-'+money(r.amount)+'</td><td>'+(esc(r.reason||'—'))+'</td></tr>';
    });
    H+='</tbody></table></section>';
  }

  H+='<div class="note">数据来源：连锁 chain_verify_orders（每周账单导入）+ 佛山直营 daily_reports（每日填报，金额已扣内购）· 连锁业绩=核销+验券+记账核销；直营=抖音/美团净核销；均不含内购上翻。查询时间：'+iso(new Date())+'</div>';
  out.innerHTML=H;
}

async function run(reload){
  const start=$('dStart').value, end=$('dEnd').value;
  if(!start||!end){ $('out').innerHTML='<div class="errbox">请先选择起始日和结束日</div>'; return; }
  if(start>end){ $('out').innerHTML='<div class="errbox">起始日不能晚于结束日</div>'; return; }
  const pl=$('periodLabel'); if(pl) pl.textContent='当前周期：'+start+' ~ '+end;
  if(reload){
    $('out').innerHTML='<div class="loadbox"><div class="spin"></div><br>正在加载数据…</div>';
    try{ await loadData(start,end); }catch(e){ $('out').innerHTML='<div class="errbox">'+esc(e.message)+'</div>'; return; }
  }
  try{ render(applyFilter(start,end)); }catch(e){ $('out').innerHTML='<div class="errbox">'+esc(e.message)+'</div>'; }
}

function setRange(q){
  const t=new Date(); const today=iso(t);
  let s,e;
  if(q==='mtd'){ s=iso(new Date(t.getFullYear(),t.getMonth(),1)); e=today; }
  else if(q==='pm'){ const pm=new Date(t.getFullYear(),t.getMonth()-1,1); s=iso(pm); e=iso(new Date(t.getFullYear(),t.getMonth(),0)); }
  else { const n=Number(q); s=iso(addD(t,-(n-1))); e=today; }
  $('dStart').value=s; $('dEnd').value=e;
  document.querySelectorAll('#quick button').forEach(b=>b.classList.toggle('on',b.dataset.q===q));
}

(async function init(){
  setRange('30');
  document.querySelectorAll('#quick button').forEach(b=>b.addEventListener('click',()=>{ setRange(b.dataset.q); run(true); }));
  $('dStart').addEventListener('change',()=>run(true));
  $('dEnd').addEventListener('change',()=>run(true));
  $('opSel').addEventListener('change',()=>run(false));
  $('pfSel').addEventListener('change',()=>run(false));
  $('typeSel').addEventListener('change',()=>run(false));
  try{
    await loadData($('dStart').value,$('dEnd').value);
    render(applyFilter($('dStart').value,$('dEnd').value));
  }catch(e){
    $('out').innerHTML='<div class="errbox">'+esc(e.message)+'<br><br>请先通过「书荀连锁」页面登录后再打开本页。</div>';
  }
})();
</script>
